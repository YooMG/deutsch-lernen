  if (overlay) { overlay.style.display = 'flex'; overlay.style.opacity = '1'; }
  if (subtitle) subtitle.textContent = 'سجّل دخولك لحفظ تقدّمك على كل أجهزتك';
  if (btn) btn.style.display = 'flex';
}

function hideLoginScreen() {
  const overlay = document.getElementById('authOverlay');
  if (!overlay) return;
  overlay.style.transition = 'opacity 0.3s';
  overlay.style.opacity = '0';
  setTimeout(() => { overlay.style.display = 'none'; overlay.style.opacity = '1'; overlay.style.transition = ''; }, 320);
}

function updateUserUI(user) {
  const wrap  = document.getElementById('userAvatarWrap');
  const img   = document.getElementById('userAvatar');
  const name  = document.getElementById('userName');
  const email = document.getElementById('userEmail');
  const profileBtn = document.getElementById('profileNavBtn');
  window._currentUser = user;
  if (user) {
    if (wrap)  wrap.style.display  = 'block';
    if (img)   img.src = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName||'U') + '&background=2f7d8a&color=fff&size=64';
    if (name)  name.textContent  = user.displayName || 'مستخدم';
    if (email) email.textContent = user.email || '';
    if (profileBtn) profileBtn.style.display = 'block';
  } else {
    if (wrap)  wrap.style.display  = 'none';
    if (profileBtn) profileBtn.style.display = 'none';
  }
}

// ── Sync keys ──
const KEYS = ['wortschatz_known_v1','verben_known_v1','wortschatz_custom_v1',
              'verben_custom_v1','wortschatz_custom_cats_v1','dt_tasks_v3','dt_level','deutsch_theme'];

function getSnapshot() {
  const o = {};
  KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) o[k] = v; });
  return o;
}
function applySnapshot(data) {
  if (!data) return;
  const theme = localStorage.getItem('deutsch_theme');
  KEYS.forEach(k => { if (data[k] != null) try { localStorage.setItem(k, data[k]); } catch(e){} });
  if (theme) localStorage.setItem('deutsch_theme', theme);
}

let _uid = null;

async function upload(uid) {
  try {
    await setDoc(doc(db,'users',uid), { ...getSnapshot(), updatedAt: serverTimestamp() }, { merge: true });
    const b = document.getElementById('syncBadge');
    if (b) { b.style.display='inline'; b.textContent='✓ متزامن'; }
  } catch(e) { console.warn('Upload error:', e); }
}

async function download(uid) {
  try {
    const snap = await getDoc(doc(db,'users',uid));
    if (snap.exists()) applySnapshot(snap.data());
  } catch(e) { console.warn('Download error:', e); }
}

// Patch localStorage to auto-sync after writes
const _orig = localStorage.setItem.bind(localStorage);
localStorage.setItem = (key, val) => {
  _orig(key, val);
  if (_uid && KEYS.includes(key)) {
    clearTimeout(localStorage._t);
    localStorage._t = setTimeout(() => upload(_uid), 2000);
  }
};

// ── Auth state — fires immediately with cached user if session exists ──
onAuthStateChanged(auth, async (user) => {
  if (user) {
    _uid = user.uid;
    updateUserUI(user);
    await download(user.uid);
    hideLoginScreen();
    if (typeof applyTheme === 'function') applyTheme();
    if (typeof setView   === 'function') setView('home');
    setInterval(() => upload(user.uid), 3 * 60 * 1000);
  } else {
    _uid = null;
    updateUserUI(null);
    showLoginScreen();
  }
});

// ── Exposed functions ──
window.authSignIn = () => {
  const err = document.getElementById('authErr');
  const btn = document.querySelector('.auth-google-btn');
  if (err) err.style.display = 'none';
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  signInWithPopup(auth, provider)
    .catch(e => {
      if (err) { err.style.display='block'; err.textContent = 'خطأ: ' + (e.message||'حاول مجدداً'); }
      if (btn) { btn.disabled=false; btn.style.opacity='1'; }
    });
};

window.authSignOut = async () => {
  if (!confirm('تسجيل الخروج؟')) return;
  if (_uid) await upload(_uid);
  _uid = null;
  await signOut(auth);
};

window.syncNow = async () => {
  if (!_uid) return;
  const b = document.getElementById('syncBadge');
  if (b) { b.style.display='inline'; b.textContent='⏳'; }
  await upload(_uid);
};

window.toggleUserMenu = () => {
  const m = document.getElementById('userMenu');
  if (m) m.classList.toggle('open');
};

document.addEventListener('click', e => {
  const wrap = document.getElementById('userAvatarWrap');
  if (wrap && !wrap.contains(e.target)) {
    const m = document.getElementById('userMenu');
    if (m) m.classList.remove('open');
  }
});
</script>
</body>

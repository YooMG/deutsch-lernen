<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="author" content="Youssef MG">
<meta name="description" content="منصة تعلّم الألمانية — مفردات وأفعال. إنتاج Youssef MG (Instagram @you.ssef.mg)">
<title>Deutsch Lernen · منصة تعلّم الألمانية</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1813" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch Lernen">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- iOS safe area -->
<style>
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .nav { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Spectral:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5efe3;--paper-2:#efe7d7;--card:#fbf7ee;--ink:#2c2a24;--ink-soft:#6a6457;--line:#ddd2bd;
  --green:#1f6b53;--green-d:#164d3c;--amber:#c8821f;--amber-soft:#f0d9a8;--rust:#b0533a;--teal:#2f7d8a;--blue:#3a5a8c;
  --shadow:0 1px 2px rgba(44,42,36,.06),0 8px 28px rgba(44,42,36,.08);
  --shadow-lg:0 18px 50px rgba(44,42,36,.16);
  --hero1:#1f6b53;--hero2:#2f7d8a;--hero3:#3a5a8c;
}
[data-theme="dark"]{
  --paper:#1a1813;--paper-2:#221f19;--card:#26231d;--ink:#ece4d3;--ink-soft:#9b9181;--line:#3a352c;
  --green:#3fae8a;--green-d:#5cc6a1;--amber:#e0a24b;--amber-soft:#5a4a2c;--rust:#d4715a;--teal:#4ba3b3;--blue:#6f93cc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  --hero1:#16432f;--hero2:#1c4a52;--hero3:#23375a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 10% 6%,rgba(31,107,83,.07),transparent 40%),radial-gradient(circle at 92% 90%,rgba(58,90,140,.08),transparent 42%)}
.de{font-family:'Fraunces',serif;direction:ltr;unicode-bidi:plaintext}
.de-b{font-family:'Spectral',serif;direction:ltr;unicode-bidi:plaintext}
button{font-family:inherit}

/* ---------- header ---------- */
/* ── YouTube-style sidebar layout ── */
.app-shell{display:flex;min-height:100vh}
/* Top bar */
header.top{position:fixed;top:0;left:0;right:0;z-index:100;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:56px}
.top-inner{height:56px;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand .mark{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(150deg,var(--hero1),var(--hero3));color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:22px;box-shadow:var(--shadow)}
.brand h1{font-size:17px;font-weight:800;line-height:1.05}
.brand h1 span{font-family:'Fraunces',serif;color:var(--green-d)}
.brand p{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.top-logo{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.top-logo span{color:var(--teal)}
.top-spacer{flex:1}
.h-right{display:flex;align-items:center;gap:10px}

/* Sidebar */
/* ── YouTube-style sidebar ── */
.sidebar{
  position:fixed;top:56px;right:0;bottom:0;
  width:80px;
  background:var(--paper);
  border-left:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;
  z-index:90;
  padding:8px 0 24px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.nav{display:contents}

/* Each nav button: icon on top, label below — exactly like YouTube */
.nav button{
  width:100%;border:none;background:none;
  color:var(--ink-soft);
  padding:14px 4px 12px;
  border-radius:12px;
  cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:inherit;
}
.nav button.active{color:var(--ink)}
.nav button:hover:not(.active){background:var(--paper-2);color:var(--ink)}
.nav-icon{font-size:22px;line-height:1;display:block}
.nav-label{font-size:10px;font-weight:700;line-height:1.1;text-align:center;display:block;white-space:nowrap}
.nav button.active .nav-label{font-weight:800}

/* Active indicator — thin bar on right like YouTube */
.nav button.active{
  position:relative;
  color:var(--ink);
  background:color-mix(in srgb,var(--teal) 10%,var(--paper));
  border-radius:12px;
}
.sidebar-divider{height:1px;background:var(--line);margin:6px 12px;width:calc(100% - 24px)}

/* Main content — to the left of sidebar */
.main-content{margin-right:80px;margin-top:56px;min-height:calc(100vh - 56px);padding:0}
#app{padding:24px 28px 60px}

/* Mobile — sidebar becomes bottom tab bar like YouTube app */
@media(max-width:768px){
  .sidebar{
    top:auto;right:0;left:0;bottom:0;
    width:100%;height:60px;
    flex-direction:row;
    border-left:none;border-top:1px solid var(--line);
    padding:0;
    overflow-x:auto;overflow-y:hidden;
    gap:0;align-items:stretch;justify-content:space-around;
  }
  .nav button{
    padding:6px 4px 4px;
    border-radius:0;
    flex-direction:column;
    gap:2px;
    min-width:52px;
    flex:1;
    align-items:center;
    max-width:80px;
  }
  .nav-icon{font-size:22px}
  .nav-label{font-size:9.5px;font-weight:700}
  .sidebar-divider{display:none}
  .main-content{margin-right:0;margin-bottom:60px}
  #app{padding:14px 14px 16px}
  /* Active indicator on mobile — dot under icon */
  .nav button.active{background:transparent;border-radius:0}
  .nav button.active .nav-icon{filter:drop-shadow(0 0 0 var(--teal))}
  .nav-active-dot{display:none}
}
.search{position:relative;width:230px;transition:.2s}
.search.hidden{display:none}
.search input{width:100%;padding:10px 38px 10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-family:'Tajawal';font-size:14.5px;color:var(--ink);outline:none;transition:.2s}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-soft)}
.theme-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:.18s}
.theme-btn:hover{border-color:var(--green);color:var(--green-d)}
.theme-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- home ---------- */
.home{max-width:1080px;margin:0 auto;padding:40px 22px 60px}
.hero{position:relative;border-radius:28px;overflow:hidden;padding:54px 40px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:var(--shadow-lg);margin-bottom:34px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.16),transparent 45%),radial-gradient(circle at 10% 90%,rgba(0,0,0,.12),transparent 40%)}
.hero-in{position:relative;z-index:1}
.hero .eyebrow{font-family:'Fraunces',serif;font-style:italic;font-size:17px;opacity:.85;letter-spacing:.5px}
.hero h2{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.1;margin:6px 0 12px}
.hero h2 .de{color:#ffe9c2}
.hero p{font-size:16px;max-width:560px;opacity:.92;line-height:1.6}
.hero-stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hs{display:flex;flex-direction:column}
.hs b{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1}
.hs span{font-size:13px;opacity:.85;margin-top:3px}
.hs .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#ffe9c2 calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;margin-bottom:6px}
.hs .ring i{width:50px;height:50px;border-radius:50%;background:var(--hero1);display:grid;place-items:center;font-family:'Fraunces';font-weight:600;font-size:15px;font-style:normal}

.cards2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:780px){.cards2{grid-template-columns:1fr}}
.feat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.feat:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.feat::before{content:"";position:absolute;top:0;inset-inline-start:0;right:0;height:5px;background:var(--accent)}
.feat .ic{font-size:38px;margin-bottom:14px}
.feat h3{font-size:23px;font-weight:800}
.feat h3 .de{display:block;font-size:15px;color:var(--ink-soft);font-style:italic;margin-top:2px}
.feat .desc{color:var(--ink-soft);font-size:14px;margin:12px 0 18px;line-height:1.6}
.feat .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mtag{font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink-soft);padding:4px 11px;border-radius:8px}
.feat .pbar{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.feat .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.feat .pinfo{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);font-weight:700}
.go{margin-top:18px;display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:12px;cursor:pointer;transition:.15s}
.go:hover{filter:brightness(1.08)}
.home-note{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:30px}
.home-note button{background:none;border:none;color:var(--rust);font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px}

/* ---------- section shell ---------- */
.shell{max-width:1280px;margin:0 auto;padding:20px 22px;display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
@media(max-width:940px){.shell{grid-template-columns:1fr;padding:14px}}
aside{position:sticky;top:84px}
@media(max-width:940px){aside{position:static}}
.stat-card{color:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.stat-card .big{font-family:'Fraunces',serif;font-size:33px;font-weight:600;line-height:1}
.stat-card .big small{font-size:16px;opacity:.7}
.stat-card .lbl{font-size:13px;opacity:.88;margin-top:3px}
.bar{height:8px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffe9c2;border-radius:99px;transition:width .5s}
.stat-sub{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;opacity:.92}
.reset{font-size:12px;color:#fff;background:rgba(255,255,255,.16);border:none;cursor:pointer;font-weight:700;margin-top:11px;padding:6px 12px;border-radius:9px;transition:.15s}
.reset:hover{background:rgba(255,255,255,.27)}
.modebar{display:flex;gap:5px;background:var(--paper-2);padding:5px;border-radius:13px;border:1px solid var(--line);margin-bottom:16px}
.modebar button{flex:1;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--ink-soft);padding:9px 6px;border-radius:9px;cursor:pointer;transition:.18s}
.modebar button.active{background:var(--card);color:var(--green-d);box-shadow:var(--shadow)}

.side-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow);margin-bottom:16px;max-height:calc(100vh - 340px);overflow:auto}
@media(max-width:940px){.side-box{max-height:none}}
.side-box::-webkit-scrollbar{width:8px}.side-box::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.side-box .hd{font-size:12px;font-weight:700;color:var(--ink-soft);padding:8px 12px 6px;letter-spacing:.3px}
.cat{display:flex;align-items:flex-start;gap:11px;width:100%;border:none;background:none;text-align:start;padding:10px 12px;border-radius:11px;cursor:pointer;transition:.15s}
.cat:hover{background:var(--paper-2)}
.cat.active{background:var(--accent);color:#fff}
.cat.active .c-de,.cat.active .c-cnt{color:#fff}
.cat .ico{font-size:18px;flex:none;width:24px;text-align:center;line-height:1.4}
.cat .c-main{flex:1;min-width:0}
.cat .c-ar{font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:break-word}
.cat .c-de{font-size:11.5px;color:var(--ink-soft);font-family:'Fraunces',serif;line-height:1.25;overflow-wrap:break-word;margin-top:1px}
.cat .c-cnt{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--paper-2);padding:2px 8px;border-radius:8px;flex:none;white-space:nowrap;margin-top:1px}
.cat.active .c-cnt{background:rgba(255,255,255,.2)}
.cat-wrap{position:relative;display:flex;align-items:stretch}
.cat-wrap .cat{flex:1}
.cat-edit-btn{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:13px;cursor:pointer;opacity:0;transition:.15s;color:var(--ink-soft);line-height:1;z-index:2}
.cat-wrap:hover .cat-edit-btn{opacity:1}
.cat-wrap .cat-edit-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.lvl-dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}

main{min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--ink-soft);padding:7px 13px;border-radius:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.chip:hover:not(.on){border-color:var(--green);color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip .cd{width:8px;height:8px;border-radius:50%}
.panel-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.panel-head .icn{font-size:28px}
.panel-head h2{font-size:23px;font-weight:800}
.panel-head h2 .sub{display:block;font-family:'Fraunces',serif;font-size:15px;font-weight:500;color:var(--green-d);font-style:italic;margin-top:2px}
.panel-head .count{margin-inline-start:auto;font-size:13px;color:var(--ink-soft);font-weight:700}

/* word cards */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.word{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;transition:.18s;position:relative;overflow:hidden}
.word::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line);transition:.2s}
.word:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.word.known::before{background:var(--green)}
.word.known{background:linear-gradient(90deg,color-mix(in srgb,var(--green) 8%,var(--card)),var(--card) 60%)}
.word .wmain{flex:1;min-width:0}
.word .wde{font-family:'Fraunces',serif;font-size:17.5px;font-weight:600;color:var(--ink);direction:ltr;line-height:1.25}
.word .war{font-size:15px;color:var(--green-d);font-weight:500;margin-top:3px}
.chk{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;transition:.15s;color:transparent}
.chk:hover{border-color:var(--green)}
.known .chk{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:16px;height:16px;stroke:currentColor;stroke-width:3}

/* verb cards */
.verbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:.18s;position:relative;overflow:hidden}
.vcard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--lvlc,var(--line))}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.vcard.known{background:linear-gradient(90deg,color-mix(in srgb,var(--green) 7%,var(--card)),var(--card) 55%)}
.v-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.v-inf{flex:1;min-width:0}
.v-de{font-family:'Fraunces',serif;font-size:22px;font-weight:600;direction:ltr;line-height:1.15}
.v-ar{font-size:15.5px;color:var(--green-d);font-weight:700;margin-top:2px}
.v-badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.b-lvl{font-family:'Fraunces';font-weight:700;font-size:12px;color:#fff;padding:2px 9px;border-radius:7px;direction:ltr}
.b-aux{font-family:'Fraunces';font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;direction:ltr;border:1px solid}
.aux-haben{color:var(--green-d);border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.aux-sein{color:var(--blue);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.aux-both{color:var(--amber);border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.stamm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper-2);border-radius:10px;padding:9px 12px;margin-bottom:9px;direction:ltr}
.stamm .s{font-family:'Spectral',serif;font-size:15px}
.stamm .s b{font-weight:600}
.stamm .arrow{color:var(--ink-soft);font-size:13px}
.stamm .lbl{font-family:'Tajawal';font-size:9.5px;color:var(--ink-soft);display:block;font-weight:700;direction:rtl}
.stamm .perf b{color:var(--green-d)}
.v-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:4px}
.tag-case{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.tag-prep{background:color-mix(in srgb,var(--rust) 12%,transparent);color:var(--rust);font-family:'Fraunces';direction:ltr}
.tag .k{font-family:'Tajawal';font-size:10px;opacity:.7}
.v-ex{border-inline-start:3px solid var(--amber-soft);padding-inline-start:11px;margin-bottom:8px}
.v-ex .de-ex{font-family:'Spectral',serif;font-size:14.5px;direction:ltr;line-height:1.4}
.v-ex .ar-ex{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.v-note{font-size:12.5px;color:var(--ink-soft);line-height:1.45;background:color-mix(in srgb,var(--amber) 7%,transparent);border-radius:9px;padding:7px 11px}
.v-note::before{content:"💡 "}

/* flashcards */
.fc-wrap{max-width:600px;margin:0 auto;text-align:center}
.fc-controls{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px;color:var(--ink-soft);padding:8px 14px;border-radius:11px;cursor:pointer;transition:.15s}
.pill.on{background:var(--green);color:#fff;border-color:var(--green)}
.pill.on.rust-pill{background:var(--rust);border-color:var(--rust)}
.pill:hover:not(.on){border-color:var(--green);color:var(--ink)}
.flashcard{perspective:1800px;min-height:320px;margin-bottom:18px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:320px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;box-shadow:var(--shadow-lg);padding:28px;display:flex;flex-direction:column;justify-content:center}
.fc-front{background:var(--card);border:1px solid var(--line);align-items:center;text-align:center;gap:10px}
.fc-front .fc-term{font-family:'Fraunces',serif;font-size:40px;font-weight:600;direction:ltr}
.fc-front .fc-term.ar-term{font-family:'Tajawal';direction:rtl}
.fc-front .fc-tag{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.fc-front .fc-hint{font-size:13px;color:var(--ink-soft);margin-top:8px}
.fc-back{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 68%,#000));color:#fff;transform:rotateY(180deg);text-align:start;gap:11px;overflow:auto}
.fc-back .bk-de{font-family:'Fraunces',serif;font-size:30px;font-weight:600;direction:ltr;text-align:center}
.fc-back .bk-ar{font-size:18px;font-weight:700;text-align:center;opacity:.96}
.fc-back .bk-stamm{background:rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;direction:ltr;text-align:center;font-family:'Spectral',serif;font-size:16px}
.fc-back .bk-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px}
.fc-back .bk-chip{background:rgba(255,255,255,.17);padding:3px 11px;border-radius:8px;direction:ltr;font-family:'Fraunces'}
.fc-back .bk-ex{border-inline-start:3px solid rgba(255,255,255,.42);padding-inline-start:11px;font-size:14px}
.fc-back .bk-ex .de-ex{font-family:'Spectral',serif;direction:ltr}
.fc-back .bk-ex .ar-ex{opacity:.86;font-size:13px;margin-top:2px}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:14px}
.nbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:.15s;color:var(--ink)}
.nbtn:hover{background:var(--green);color:#fff;border-color:var(--green)}
.nbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.fc-pos{font-family:'Fraunces',serif;font-size:17px;font-weight:600;min-width:90px}
.fc-pos b{font-size:22px;color:var(--green-d)}
.fc-mark{margin-top:16px}
.btn{border:none;background:var(--green);color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper-2)}

/* quiz */
.quiz-wrap{max-width:600px;margin:0 auto}
.q-modes{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.q-prog{height:7px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-bottom:20px;border:1px solid var(--line)}
.q-prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow-lg);text-align:center}
.q-meta{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:10px}
.q-prompt{font-family:'Fraunces',serif;font-size:34px;font-weight:600;direction:ltr;margin-bottom:6px}
.q-prompt.ar-prompt{font-family:'Tajawal';direction:rtl}
.q-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px}
.q-opts{display:grid;gap:11px}
.q-opt{border:1.5px solid var(--line);background:var(--paper);border-radius:13px;padding:15px 18px;cursor:pointer;font-size:18px;font-weight:600;color:var(--ink);transition:.15s;text-align:start}
.q-opt.is-de{font-family:'Fraunces',serif;direction:ltr;text-align:center}
.q-opt:hover:not(.locked){border-color:var(--green);background:var(--card)}
.q-opt.correct{background:color-mix(in srgb,var(--green) 16%,transparent);border-color:var(--green);color:var(--green-d)}
.q-opt.wrong{background:color-mix(in srgb,var(--rust) 14%,transparent);border-color:var(--rust);color:var(--rust)}
.q-opt.locked{cursor:default}
.q-write{display:flex;gap:10px;margin-top:6px}
.q-write input{flex:1;padding:15px 18px;border:1.5px solid var(--line);border-radius:13px;background:var(--paper);font-family:'Fraunces',serif;font-size:20px;direction:ltr;color:var(--ink);outline:none}
.q-write input:focus{border-color:var(--green)}
.q-write input.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.q-write input.wrong{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 10%,transparent)}
.q-fb{margin-top:12px;font-weight:700;font-size:15px;min-height:22px}
.q-fb.ok{color:var(--green-d)}.q-fb.no{color:var(--rust)}
.q-fb .de{font-family:'Fraunces'}
.q-next{margin-top:16px}
.q-next:empty{margin-top:0}
.next-btn{width:100%;font-size:16px;padding:14px;animation:fade .25s ease}
.q-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-score{font-family:'Fraunces',serif;font-weight:600;font-size:16px}
.q-score b{color:var(--green-d)}
.q-result{text-align:center;padding:14px}
.q-result .em{font-size:54px}
.q-result h3{font-size:26px;font-family:'Fraunces',serif;margin:8px 0}
.q-result .sc{font-size:18px;color:var(--ink-soft);margin-bottom:20px}
.rbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:0 auto 8px;max-width:340px;background:var(--paper-2)}
.rbar .rb-ok{background:var(--green)}
.rbar .rb-no{background:var(--rust)}
.rbar-leg{display:flex;justify-content:center;gap:20px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.rbar-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.rbar-leg .d-ok{background:var(--green)}.rbar-leg .d-no{background:var(--rust)}
.report{margin-top:22px;text-align:start}
.report-hd{font-size:14px;font-weight:800;color:var(--ink-soft);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.report-list{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding-inline-end:4px}
.report-list::-webkit-scrollbar{width:8px}.report-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.rrow{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.rrow.ok{border-inline-start:4px solid var(--green)}
.rrow.no{border-inline-start:4px solid var(--rust);background:color-mix(in srgb,var(--rust) 5%,var(--paper))}
.rr-ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-top:1px}
.rrow.ok .rr-ic{background:var(--green)}.rrow.no .rr-ic{background:var(--rust)}
.rr-body{flex:1;min-width:0}
.rr-q{font-size:15px;font-weight:700;line-height:1.4}
.rr-q .rr-num{color:var(--ink-soft);font-weight:700}
.rr-q .rp-de{font-family:'Fraunces',serif;direction:ltr;unicode-bidi:plaintext}
.rr-ans{font-size:13.5px;color:var(--green-d);margin-top:2px}
.rr-ans .de{font-family:'Fraunces',serif;direction:ltr;unicode-bidi:plaintext}
.rr-given{font-size:13px;color:var(--rust);margin-top:2px}
.rr-given .de{font-family:'Fraunces',serif;direction:ltr;unicode-bidi:plaintext}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.q-setup{max-width:520px;margin:0 auto}
.q-setup-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow-lg);text-align:center}
.qs-icon{font-size:40px;margin-bottom:6px}
.qs-lead{font-size:20px;font-weight:800;margin-bottom:6px}
.qs-avail{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px}
.qs-avail b{color:var(--green-d);font-family:'Fraunces'}
.count-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:9px;margin-bottom:18px}
.count-btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 6px;cursor:pointer;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--ink);transition:.15s}
.count-btn:hover{border-color:var(--green);color:var(--green-d)}
.count-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.count-custom{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px;flex-wrap:wrap}
.cc-lbl{font-size:13.5px;color:var(--ink-soft);font-weight:700}
.count-custom input{width:110px;padding:10px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);font-family:'Fraunces',serif;font-size:17px;text-align:center;color:var(--ink);outline:none;direction:ltr}
.count-custom input:focus{border-color:var(--green)}
.cc-max{font-family:'Fraunces';font-size:14px;color:var(--ink-soft)}
.q-setup .start{width:100%;font-size:16px;padding:14px}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty .e{font-size:46px;margin-bottom:10px}
footer{text-align:center;padding:30px;color:var(--ink-soft);font-size:12.5px}
.credit{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;margin:0 auto;padding:26px 22px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.credit .who{display:flex;align-items:center;gap:13px}
.credit .ava{width:56px;height:56px;border-radius:50%;flex:none;padding:3px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:grid;place-items:center}
.credit .ava .inner{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;overflow:hidden}
.credit .ava .inner img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.credit .ava .inner span{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--ink);direction:ltr}
.credit .who .txt{text-align:start}
.credit .who .role{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--ink-soft);text-transform:uppercase}
.credit .who .name{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--ink);direction:ltr;line-height:1.1}
.ig-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;color:#fff;padding:9px 16px;border-radius:11px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);transition:.18s;direction:ltr}
.ig-link:hover{filter:brightness(1.07);transform:translateY(-1px)}
.ig-link svg{width:18px;height:18px;fill:#fff}
.credit .meta{font-size:12px;color:var(--ink-soft)}
.add-btn{width:100%;border:1.5px dashed var(--accent,var(--green));background:color-mix(in srgb,var(--accent,var(--green)) 8%,var(--card));color:var(--accent,var(--green));font-family:'Tajawal';font-weight:800;font-size:14px;padding:12px;border-radius:14px;cursor:pointer;margin-bottom:16px;transition:.15s}
.add-btn:hover{background:color-mix(in srgb,var(--accent,var(--green)) 18%,var(--card))}
.modal-ov{position:fixed;inset:0;z-index:200;background:rgba(20,18,14,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;animation:fade .22s ease}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:470px;max-height:92vh;overflow:auto;padding:24px 24px 22px}
.modal h3{font-size:20px;font-weight:800}
.modal .m-sub{font-size:13px;color:var(--ink-soft);margin:3px 0 18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);font-family:'Tajawal';font-size:15px;color:var(--ink);outline:none;transition:.15s;resize:vertical}
.fld input.de-in{font-family:'Fraunces',serif;direction:ltr}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent,var(--green));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,var(--green)) 16%,transparent)}
.fld .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:460px){.fld-row{grid-template-columns:1fr}}
.modal-acts{display:flex;gap:10px;margin-top:16px}
.modal-acts .btn{flex:1}
.m-err{color:var(--rust);font-size:13px;font-weight:700;margin-top:8px;min-height:16px;text-align:center}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger>*{animation:fade .4s ease backwards}

/* ════════ AUTH OVERLAY ════════ */
#authOverlay{position:fixed;inset:0;background:var(--paper);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;transition:opacity .35s}
#authOverlay.hiding{opacity:0;pointer-events:none}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px 32px 36px;max-width:380px;width:90%;text-align:center;box-shadow:var(--shadow-lg)}
.auth-logo{font-size:48px;margin-bottom:16px}
.auth-title{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:6px}
.auth-subtitle{font-size:14px;color:var(--ink-soft);margin-bottom:28px;line-height:1.5}
.auth-google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;background:#fff;border:1.5px solid #ddd;border-radius:12px;font-size:15px;font-weight:700;color:#3c4043;cursor:pointer;transition:.15s;font-family:inherit}
.auth-google-btn:hover{background:#f8f8f8;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.auth-google-btn svg{flex:none}
.auth-note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;opacity:.7}
.auth-error{color:#c0392b;font-size:13px;margin-top:12px;display:none}

/* User avatar in header */
.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid var(--line);flex:none;transition:.15s}
.user-avatar:hover{border-color:var(--teal)}
.user-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;min-width:200px;z-index:1000;display:none;flex-direction:column;gap:2px}
.user-menu.open{display:flex}
.user-menu-name{font-size:13px;font-weight:700;color:var(--ink);padding:8px 12px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.user-menu-email{font-size:11px;color:var(--ink-soft);padding:0 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.user-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;transition:.15s;background:none;border:none;width:100%;text-align:start;font-family:inherit}
.user-menu-item:hover{background:var(--paper-2)}
.user-menu-item.danger{color:#c0392b}
.sync-badge{font-size:10px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--teal) 15%,var(--card));color:var(--teal);font-weight:700}
.syncing-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:syncpulse 1s ease-in-out infinite;display:inline-block;margin-inline-start:6px}
@keyframes syncpulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
/* ════════ HÖREN SECTION ════════ */
.horen-wrap{max-width:820px;margin:0 auto;padding:8px 0 60px}
.horen-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.horen-header h2{font-size:22px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
.horen-header h2 span.de{font-family:'Fraunces',serif;color:var(--teal);font-style:italic;font-size:18px}
.horen-header p{color:var(--ink-soft);font-size:13.5px;margin-top:4px}

/* Upload zone */
.upload-zone{border:1.5px dashed var(--line);border-radius:14px;padding:12px 20px;cursor:pointer;transition:.2s;background:var(--card);display:flex;align-items:center;gap:14px;margin-bottom:16px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 5%,var(--card))}
.upload-zone .uz-icon{font-size:24px;flex:none}
.upload-zone .uz-title{font-size:13.5px;font-weight:700;color:var(--ink)}
.upload-zone .uz-types{font-size:11px;color:var(--ink-soft);opacity:.65;margin-top:2px}

/* Niveau tabs */
.hn-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;direction:ltr}
.hn-tab{padding:5px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.hn-tab:hover{border-color:var(--ink-soft);color:var(--ink)}
.hn-tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}

/* Track card — SoundCloud style */
.sc-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;margin-bottom:12px}
.sc-card.playing{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent),var(--shadow)}
.sc-top{display:grid;grid-template-columns:64px 1fr;min-height:80px}
.sc-art{width:64px;height:80px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;cursor:pointer;position:relative;overflow:hidden}
.sc-art-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.sc-card.playing .sc-art-overlay,.sc-art:hover .sc-art-overlay{opacity:1}
.sc-art-btn{font-size:24px;color:#fff}
.sc-right{display:flex;flex-direction:column;justify-content:center;padding:10px 14px 10px 12px;min-width:0}
.sc-meta-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sc-info{min-width:0;flex:1}
.sc-artist{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
.sc-title{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-badges{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.sc-type-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line)}
.niv-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;margin-inline-start:6px;vertical-align:middle}
.niv-badge.A1{background:#e8f5e9;color:#2e7d32}.niv-badge.A2{background:#e3f2fd;color:#1565c0}
.niv-badge.B1{background:#fff3e0;color:#e65100}.niv-badge.B2{background:#fce4ec;color:#c62828}
.niv-badge.C1{background:#f3e5f5;color:#6a1b9a}
[data-theme=dark] .niv-badge.A1{background:#1b3a1e;color:#66bb6a}
[data-theme=dark] .niv-badge.A2{background:#0d2744;color:#64b5f6}
[data-theme=dark] .niv-badge.B1{background:#3e2800;color:#ffb74d}
[data-theme=dark] .niv-badge.B2{background:#3b0a14;color:#ef9a9a}
[data-theme=dark] .niv-badge.C1{background:#2a0a3a;color:#ce93d8}
.sc-del{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:5px;border-radius:8px;transition:.15s;font-size:15px;flex:none;align-self:flex-start}
.sc-del:hover{color:#c0392b;background:rgba(192,57,43,.1)}

/* Waveform player */
.sc-player{padding:8px 14px 14px;border-top:1px solid var(--line);direction:ltr}
.wf-wrap{position:relative;height:64px;cursor:pointer;margin-bottom:6px;-webkit-user-select:none;user-select:none;direction:ltr}
.wf-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wf-time-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--teal);pointer-events:none;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.wf-wrap:hover .wf-time-cursor{opacity:.5}
.sc-time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:8px;font-variant-numeric:tabular-nums;direction:ltr}
.sc-controls{display:flex;align-items:center;gap:10px;justify-content:center;direction:ltr}
.sc-play-btn{width:40px;height:40px;border-radius:50%;background:var(--teal);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.sc-play-btn:hover{background:var(--green);transform:scale(1.08)}
.sc-seek-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:700;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.sc-seek-btn svg{width:15px;height:15px}
.sc-seek-btn:hover{color:var(--ink);background:var(--paper-2)}
.sc-vol{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.sc-vol-icon{font-size:13px;color:var(--ink-soft)}
.sc-vol-slider{width:80px;height:3px;-webkit-appearance:none;appearance:none;background:var(--paper-2);border-radius:99px;outline:none;cursor:pointer;accent-color:var(--teal);direction:ltr}
.sc-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--teal);cursor:pointer}
.sc-vol-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--teal);border:none;cursor:pointer}
.sc-speed{display:flex;gap:4px;direction:ltr;flex-wrap:wrap}
.sc-speed-btn{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;transition:.15s}
.sc-speed-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.sc-bottom-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:space-between;direction:ltr}


/* ════════ HÖREN QUIZ PANEL ════════ */
.hq-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border:none;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.hq-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.hq-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.hq-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.hq-status{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;padding:10px 0}
.hq-status .wf-dots span{background:var(--teal)}
.hq-transcript{background:var(--paper-2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-soft);line-height:1.7;direction:auto}
.hq-transcript strong{color:var(--ink);font-size:12px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.hq-section-title{font-size:13px;font-weight:800;color:var(--ink);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
/* MCQ */
.hq-mcq{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.hq-q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hq-q-text{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.5}
.hq-options{display:flex;flex-direction:column;gap:6px}
.hq-opt{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:13.5px;color:var(--ink);transition:.15s;text-align:start;line-height:1.4;font-family:inherit;width:100%}
.hq-opt:hover:not(:disabled){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 6%,var(--paper))}
.hq-opt.correct{border-color:#1f6b53;background:color-mix(in srgb,#1f6b53 12%,var(--paper));color:#1f6b53;font-weight:700}
.hq-opt.wrong{border-color:#b0533a;background:color-mix(in srgb,#b0533a 10%,var(--paper));color:#b0533a}
.hq-opt-letter{width:22px;height:22px;border-radius:6px;background:var(--line);color:var(--ink-soft);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hq-opt.correct .hq-opt-letter{background:#1f6b53;color:#fff}
.hq-opt.wrong .hq-opt-letter{background:#b0533a;color:#fff}
.hq-explain{font-size:12px;color:var(--ink-soft);margin-top:6px;padding:6px 10px;background:var(--paper-2);border-radius:8px;display:none;line-height:1.5}
.hq-q.answered .hq-explain{display:block}
/* Open questions */
.hq-open{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
.hq-open-q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hq-open-q-text{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.5}
.hq-open-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;resize:vertical;min-height:70px;transition:.15s;direction:auto}
.hq-open-textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 15%,transparent)}
.hq-submit-open{margin-top:4px;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.hq-submit-open:hover{background:var(--green)}
.hq-feedback{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;background:var(--paper-2);color:var(--ink-soft);display:none;direction:auto}
.hq-open-q.evaluated .hq-feedback{display:block}
.hq-score{text-align:center;padding:12px;background:color-mix(in srgb,var(--teal) 10%,var(--card));border-radius:12px;margin-top:10px;font-size:15px;font-weight:800;color:var(--teal)}



/* ── Spaced Repetition badge ── */
.sr-due-banner{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--amber) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--amber) 40%,var(--line));border-radius:14px;padding:10px 14px;margin-bottom:12px;cursor:pointer;transition:.15s}
.sr-due-banner:hover{background:color-mix(in srgb,var(--amber) 20%,var(--card));}
.sr-due-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none;animation:srpulse 1.5s infinite}
@keyframes srpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 50%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.sr-due-text{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.sr-due-count{font-size:18px;font-weight:900;color:var(--amber);min-width:28px;text-align:center}
.c-cnt.sr-badge{position:relative}
.c-cnt.sr-badge::after{content:attr(data-due);position:absolute;top:-5px;inset-inline-start:-5px;background:var(--amber);color:#fff;border-radius:99px;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}

/* ── Anki-style review card ── */
.anki-wrap{max-width:540px;margin:0 auto;padding:8px 0}
.anki-prog-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--ink-soft)}
.anki-prog-bar{flex:1;height:4px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.anki-prog-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:99px;transition:width .3s}
.anki-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:32px 28px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;cursor:pointer;transition:.2s;position:relative}
.anki-card:hover{border-color:var(--teal)}
.anki-label{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.anki-front{font-size:28px;font-weight:800;color:var(--ink);line-height:1.3;font-family:'Fraunces',serif}
.anki-front.ar{font-family:'Tajawal',sans-serif;direction:rtl}
.anki-back{font-size:17px;color:var(--ink-soft);margin-top:12px;line-height:1.5;display:none}
.anki-card.revealed .anki-back{display:block}
.anki-tap-hint{font-size:12px;color:var(--ink-soft);opacity:.5;margin-top:16px}
.anki-card.revealed .anki-tap-hint{display:none}
.anki-btns{display:flex;gap:10px;justify-content:center;direction:ltr}
.anki-btn{flex:1;max-width:140px;padding:12px 8px;border-radius:14px;border:2px solid transparent;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.anki-btn .ab-day{font-size:10px;font-weight:400;opacity:.7}
.anki-btn.forgot{background:color-mix(in srgb,var(--rust) 12%,var(--card));border-color:color-mix(in srgb,var(--rust) 40%,var(--line));color:var(--rust)}
.anki-btn.forgot:hover{background:var(--rust);color:#fff}
.anki-btn.hard{background:color-mix(in srgb,var(--amber) 12%,var(--card));border-color:color-mix(in srgb,var(--amber) 40%,var(--line));color:var(--amber)}
.anki-btn.hard:hover{background:var(--amber);color:#fff}
.anki-btn.easy{background:color-mix(in srgb,var(--green) 12%,var(--card));border-color:color-mix(in srgb,var(--green) 40%,var(--line));color:var(--green)}
.anki-btn.easy:hover{background:var(--green);color:#fff}
.anki-done{text-align:center;padding:40px 20px}
.anki-done .ad-icon{font-size:56px;display:block;margin-bottom:12px}
.anki-done h3{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:6px}
.anki-done p{font-size:14px;color:var(--ink-soft)}
.anki-tts{position:absolute;top:12px;inset-inline-end:12px;background:none;border:none;cursor:pointer;font-size:20px;color:var(--ink-soft);padding:4px;border-radius:8px;transition:.15s}
.anki-tts:hover{color:var(--teal);background:var(--paper-2)}

/* ── TTS button in quiz ── */
.q-tts{background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-soft);padding:4px 8px;border-radius:8px;transition:.15s;vertical-align:middle;margin-inline-start:6px}
.q-tts:hover{color:var(--teal);background:var(--paper-2)}
.q-tts.speaking{color:var(--teal);animation:ttspulse .8s ease-in-out infinite}
@keyframes ttspulse{0%,100%{opacity:1}50%{opacity:.4}}


/* ════════ SCHREIBEN SECTION ════════ */
.sw-wrap{max-width:820px;margin:0 auto;padding:8px 0 60px}
.sw-header{margin-bottom:20px}
.sw-header h2{font-size:22px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
.sw-header h2 span.de{font-family:'Fraunces',serif;color:var(--green);font-style:italic;font-size:18px}
.sw-header p{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
.sw-tabs{display:flex;gap:6px;margin-bottom:18px}
.sw-tab{padding:8px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
.sw-tab:hover{border-color:var(--green);color:var(--ink)}
.sw-tab.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ── Diary ── */
.diary-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.diary-header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.diary-title{font-size:16px;font-weight:800;color:var(--ink)}
.diary-date{font-size:12px;color:var(--ink-soft)}
.diary-streak{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--card));padding:3px 10px;border-radius:8px}
.diary-body{padding:16px 18px}
.diary-prompt{background:color-mix(in srgb,var(--green) 8%,var(--paper-2));border-right:3px solid var(--green);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--ink);line-height:1.6;direction:ltr}
.diary-prompt strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--green);margin-bottom:4px}
.diary-textarea{width:100%;min-height:180px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);font-family:'Fraunces',serif;font-size:15px;color:var(--ink);outline:none;resize:vertical;line-height:1.7;direction:ltr;transition:.15s}
.diary-textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}
.diary-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
.diary-count{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.diary-btns{display:flex;gap:8px;flex-wrap:wrap}
.diary-save-btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.diary-save-btn:hover{background:var(--green-d)}
.diary-gpt-btn{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,#10a37f 12%,var(--card));color:#10a37f;border:1.5px solid color-mix(in srgb,#10a37f 30%,var(--line));border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;transition:.15s}
.diary-gpt-btn:hover{background:color-mix(in srgb,#10a37f 22%,var(--card))}
.diary-saved-badge{display:none;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--card));padding:5px 12px;border-radius:8px}
.diary-history{margin-top:18px}
.diary-history-title{font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.diary-entry{background:var(--paper-2);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line)}
.diary-entry-date{font-size:11px;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.diary-entry-text{font-size:14px;color:var(--ink);line-height:1.7;direction:ltr;font-family:'Fraunces',serif;white-space:pre-wrap}
.diary-entry-del{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);cursor:pointer;color:#c0392b;font-size:16px;padding:5px 10px;border-radius:8px;transition:.15s;font-weight:700}
.diary-entry-del:hover{color:#c0392b;background:rgba(192,57,43,.1)}

/* ── Fill-in-the-Blanks ── */
.luecke-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.luecke-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.luecke-source{padding:6px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);font-family:inherit;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
.luecke-source:focus{border-color:var(--green)}
.luecke-count-lbl{font-size:12.5px;color:var(--ink-soft)}
.luecke-generate{background:var(--green);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.luecke-generate:hover{background:var(--green-d)}
.luecke-exercise{display:flex;flex-direction:column;gap:14px}
.luecke-item{background:var(--paper-2);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.luecke-sentence{font-size:15px;color:var(--ink);line-height:1.8;direction:ltr}
.luecke-input{display:inline-block;min-width:90px;border:none;border-bottom:2px solid var(--green);background:transparent;font-size:15px;color:var(--green);font-weight:700;outline:none;padding:0 4px;text-align:center;font-family:inherit;direction:ltr}
.luecke-input.correct{border-bottom-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 8%,transparent);border-radius:4px}
.luecke-input.wrong{border-bottom-color:var(--rust);color:var(--rust);background:color-mix(in srgb,var(--rust) 8%,transparent);border-radius:4px}
.luecke-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px}
.luecke-hint.show-ans{color:var(--green);font-weight:700}
.luecke-check-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.luecke-check{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.luecke-check:hover{background:var(--green-d)}
.luecke-new{background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.luecke-new:hover{border-color:var(--green);color:var(--ink)}
.luecke-score{font-size:14px;font-weight:800;color:var(--green);padding:8px 14px;background:color-mix(in srgb,var(--green) 10%,var(--card));border-radius:10px}
.luecke-empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px}

/* Waveform loading */
.wf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;gap:6px}
.wf-dots span{animation:wfdot 1.2s ease-in-out infinite;display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.wf-dots span:nth-child(2){animation-delay:.2s}.wf-dots span:nth-child(3){animation-delay:.4s}
@keyframes wfdot{0%,80%,100%{transform:scale(0.4);opacity:.3}40%{transform:scale(1);opacity:1}}

.horen-empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.horen-empty .he-icon{font-size:52px;display:block;margin-bottom:14px;opacity:.5}
/* Hören niveau tabs */
.hn-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;direction:ltr}
.hn-tab{padding:5px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.hn-tab:hover{border-color:var(--ink-soft);color:var(--ink)}
.hn-tab.active{color:#fff;border-color:transparent}
.hn-tab[data-niv="all"].active{background:var(--teal)}
.hn-tab[data-niv="A1"].active{background:#9b59b6}
.hn-tab[data-niv="A2"].active{background:#1D9E75}
.hn-tab[data-niv="B1"].active{background:#7F77DD}
.hn-tab[data-niv="B2"].active{background:#D85A30}
.hn-tab[data-niv="C1"].active{background:#c0392b}
/* niveau badge on track */
.niv-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;margin-inline-start:6px;flex:none}
.niv-badge.A1{background:#9b59b6}
.niv-badge.A2{background:#1D9E75}
.niv-badge.B1{background:#7F77DD}
.niv-badge.B2{background:#D85A30}
.niv-badge.C1{background:#c0392b}
/* niveau modal */
.niv-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.niv-modal{background:var(--card);border-radius:20px;padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow-lg)}
.niv-modal h3{font-size:17px;font-weight:800;margin-bottom:6px;color:var(--ink)}
.niv-modal p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.niv-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.niv-btn{padding:10px 22px;border-radius:12px;border:2px solid transparent;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;color:#fff}
.niv-btn:hover{transform:scale(1.06)}
.niv-btn.A1{background:#9b59b6}.niv-btn.A2{background:#1D9E75}
.niv-btn.B1{background:#7F77DD}.niv-btn.B2{background:#D85A30}
.niv-btn.C1{background:#c0392b}

.horen-empty p{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.horen-empty span{font-size:13px}
</style>

<body data-theme="light">

: 1; min-width: 0; }\n  .rr-text { font-size: 12px; color: var(--text-1); line-height: 1.45; }\n  .rr-meta { display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; }\n\n  .rr-chip {\n    display: inline-flex; align-items: center; gap: 3px;\n    font-size: 10.5px; color: var(--text-2);\n    background: rgba(255,255,255,0.05); border-radius: 99px; padding: 2px 7px;\n  }\n  .rr-chip i { font-size: 11px; }\n\n  .report-empty {\n    padding: 24px 18px; text-align: center;\n    font-size: 13px; color: var(--text-3);\n  }\n  .report-empty i { font-size: 24px; display: block; margin-bottom: 8px; }\n\n  /* \u2500\u2500 Jour 1 ordered list \u2500\u2500 */\n  .jour1-wrap {\n    background: var(--bg-card);\n    border: 0.5px solid var(--border);\n    border-radius: var(--radius-lg);\n    overflow: hidden;\n    margin-bottom: 1.5rem;\n  }\n  .jour1-header {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 14px 16px 12px;\n    border-bottom: 0.5px solid var(--border);\n  }\n  .jour1-title { font-size: 15px; font-weight: 500; color: var(--text-1); }\n  .jour1-sub { font-size: 11px; color: var(--text-2); font-weight: 300; margin-top: 2px; }\n  .jour1-pct { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: rgba(44,42,36,0.07); color: var(--text-2); }\n  .jour1-bar { height: 2px; background: rgba(44,42,36,0.08); margin: 0 16px 10px; border-radius: 99px; overflow: hidden; }\n  .jour1-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#7F77DD,#1D9E75,#D85A30,#D4537E); transition: width 0.35s ease; }\n  .jour1-list { list-style: none; padding: 0 10px 12px; }\n  .jour1-item {\n    display: flex; align-items: flex-start; gap: 10px;\n    padding: 7px 8px; border-radius: var(--radius-md);\n    cursor: pointer; transition: background 0.15s; user-select: none;\n    touch-action: manipulation; -webkit-tap-highlight-color: transparent;\n  }\n  .jour1-item:hover { background: var(--bg-hove  .level-pill {\n    display: inline-flex; flex-direction: column; align-items: center;\n    padding: 5px 14px; border-radius: 99px;\n    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;\n    color: var(--text-2); background: rgba(255,255,255,0.06);\n    border: 0.5px solid var(--border-md);\n    cursor: pointer; transition: all 0.2s;\n    -webkit-appearance: none; outline: none; line-height: 1.2;\n  }\n  .level-pill .level-sub { font-size: 9px; font-weight: 300; color: var(--text-3); margin-top: 1px; }\n  .level-pill:hover { background: rgba(44,42,36,0.08); color: var(--text-1); }\n  .level-pill.active[data-level=\"A2\"] { background: rgba(29,158,117,0.2); color: #4ec49a; border-color: rgba(29,158,117,0.45); }\n  .level-pill.active[data-level=\"A2\"] .level-sub { color: #4ec49a; opacity: 0.7; }\n  .level-pill.active[data-level=\"B1\"] { background: rgba(127,119,221,0.2); color: #a8a2e8; border-color: rgba(127,119,221,0.45); }\n  .level-pill.active[data-level=\"B1\"] .level-sub { color: #a8a2e8; opacity: 0.7; }\n  .level-pill.active[data-level=\"B2\"] { background: rgba(216,90,48,0.2); color: #e88460; border-color: rgba(216,90,48,0.45); }\n  .level-pill.active[data-level=\"B2\"] .level-sub { color: #e88460; opacity: 0.7; }\n  .level-pill.active[data-level=\"C1\"] { background: rgba(212,83,126,0.2); color: #e07da0; border-color: rgba(212,83,126,0.45); }\n  .level-pill.active[data-level=\"C1\"] .level-sub { color: #e07da0; opacity: 0.7; }\n  .task-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 5px; }\n\n  /* running task highlight */\n  .running-task { background: rgba(127,119,221,0.06); border-radius: var(--radius-md); }\n\n  /* done badge */\n  .done-badge { background: rgba(29,158,117,0.12) !important; color: #4ec49a !important; }\n\n  /* start / finish action buttons */\n  .task-action-btn {\n    display: inline-flex; align-items: center; gap: 4px;\n    font-size: 10.5px; font-weight: 500;\n    padding: 3px 10px; border-radius: 99px;\n    cursor: pointer; font-family: 'DM Sans', sans-serif;\n    white-space: nowrap; border: 0.5px solid;\n    transition: background 0.15s, transform 0.1s;\n    -webkit-appearance: none; outline: none; line-height: 1.4;\n  }\n  .task-action-btn:active { transform: scale(0.96); }\n\n  .start-btn {\n    background: rgba(127,119,221,0.15);\n    color: #a8a2e8;\n    border-color: rgba(127,119,221,0.35);\n  }\n  .start-btn:hover { background: rgba(127,119,221,0.28); }\n\n  .finish-btn {\n    background: rgba(29,158,117,0.18);\n    color: #4ec49a;\n    border-color: rgba(29,158,117,0.4);\n    animation: pulse-green 1.8s ease-in-out infinite;\n  }\n  .finish-btn:hover { background: rgba(29,158,117,0.32); }\n\n  @keyframes pulse-green {\n    0%, 100% { box-shadow: 0 0 0 0 rgba(29,158,117,0.35); }\n    50%       { box-shadow: 0 0 0 5px rgba(29,158,117,0); }\n  }\n\n  /* \u2500\u2500 ChatGPT button \u2500\u2500 */\n  .task-gpt-btn {\n    display: inline-flex; align-items: center; gap: 4px;\n    margin-top: 5px; font-size: 10.5px; font-weight: 500;\n    padding: 3px 9px; border-radius: 99px;\n    background: rgba(16,163,127,0.15);\n    color: #10a37f;\n    border: 0.5px solid rgba(16,163,127,0.3);\n    cursor: pointer; text-decoration: none;\n    transition: background 0.15s, border-color 0.15s;\n    font-family: 'DM Sans', sans-serif;\n    white-space: nowrap;\n    -webkit-tap-highlight-color: transparent;\n    -webkit-appearance: none; appearance: none;\n    outline: none; line-height: 1.4;\n  }\n  .task-gpt-btn:hover { background: rgba(16,163,127,0.28); border-color: rgba(16,163,127,0.5); }\n  .task-gpt-btn svg { flex-shrink: 0; }\n\n  .jour1-gpt-btn {\n    display: inline-flex; align-items: center; gap: 4px;\n    margin-top: 4px; font-size: 10px; font-weight: 500;\n    padding: 3px 8px; border-radius: 99px;\n    background: rgba(16,163,127,0.15);\n    color: #10a37f;\n    border: 0.5px solid rgba(16,163,127,0.3);\n    cursor: pointer; text-decoration: none;\n    transition: background 0.15s;\n    font-family: 'DM Sans', sans-serif;\n    white-space: nowrap;\n    -webkit-tap-highlight-color: transparent;\n    -webkit-appearance: none; appearance: none;\n    outline: none; line-height: 1.4;\n  }\n  .jour1-gpt-btn:hover { background: rgba(16,163,127,0.28); }\n\n  /* toast */\n  .toast {\n    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);\n    background: var(--bg-card); border: 0.5px solid var(--border-md); border-radius: var(--radius-md);\n    padding: 10px 18px; font-size: 13px; color: var(--text-1);\n    display: flex; align-items: center; gap: 8px;\n    box-shadow: 0 4px 20px rgba(0,0,0,0.4);\n    transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; pointer-events: none; z-index: 999;\n  }\n  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }\n  .toast i { color: #7F77DD; }\n\n  /* \u2500\u2500 Mobile responsive \u2500\u2500 */\n  @media (max-width: 480px) {\n    .app { padding: 1.25rem 0.875rem 5rem; }\n\n    /* Header */\n    .header { flex-wrap: wrap; gap: 4px; margin-bottom: 1.25rem; }\n    .header-title { font-size: 22px; }\n    .header-date { font-size: 12px; width: 100%; }\n\n    /* Cards */\n    .card-top { padding: 12px 12px 0; }\n    .card-name { font-size: 14px; }\n    .mini-bar { margin: 0 12px 8px; }\n    .tasks { padding: 0 6px 10px; }\n    .task { padding: 8px 6px; gap: 8px; }\n    .task-text { font-size: 12px; }\n    .task-dur { font-size: 10px; }\n\n    /* Jour1 */\n    .jour1-header { padding: 12px 12px 10px; }\n    .jour1-title { font-size: 13.5px; }\n    .jour1-bar { margin: 0 12px 8px; }\n    .jour1-list { padding: 0 6px 10px; }\n    .jour1-item { padding: 8px 6px; gap: 8px; }\n    .jour1-text { font-size: 12px; }\n    .jour1-body { flex-wrap: wrap; gap: 4px; }\n    .jour1-dur { font-size: 10px; }\n\n    /* Footer */\n    .footer {\n      flex-direction: column;\n      align-items: flex-start;\n      gap: 10px;\n      padding-top: 0.875rem;\n    }\n    .footer-right { width: 100%; justify-content: flex-end; }\n    .footer-summary { font-size: 12px; }\n\n    /* Report stats \u2014 stack on mobile */\n    .report-stats { grid-template-columns: 1fr 1fr; }\n    .stat-cell:nth-child(3) { border-right: none; grid-column: 1 / -1; border-top: 0.5px solid var(--border); }\n    .stat-value { font-size: 18px; }\n    .report-header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 14px; }\n    .report-rows { padding: 0 12px 10px; }\n    .report-section-head { padding: 10px 14px 8px; }\n    .rr-meta { gap: 6px; }\n\n    /* Toast position */\n    .toast { bottom: 16px; width: calc(100% - 2rem); left: 1rem; right: 1rem; transform: translateX(0) translateY(60px); }\n    .toast.show { transform: translateX(0) translateY(0); }\n\n    /* Touch targets \u2014 minimum 44px */\n    .task, .jour1-item { min-height: 44px; }\n    .icon-btn { width: 40px; height: 40px; }\n    .btn-reset { padding: 9px 18px; font-size: 13px; }\n  }\n\n  @media (max-width: 360px) {\n    .header-title { font-size: 20px; }\n    .task-text { font-size: 11.5px; }\n    .jour1-text { font-size: 11.5px; }\n    .report-stats { grid-template-columns: 1fr; }\n    .stat-cell { border-right: none !important; border-top: 0.5px solid var(--border); }\n    .stat-cell:first-child { border-top: none; }\n  }\n</style>\n</head>\n<body>\n\n<main class=\"app\">\n\n  <header class=\"header\">\n    <h1 class=\"header-title\">Deutsch lernen</h1>\n    <span class=\"header-date\" id=\"hDate\"></span>\n  </header>\n\n  <!-- Level selector -->\n  <div class=\"level-bar\">\n    <span class=\"level-label\">Niveau \u00b7 \u0627\u0644\u0645\u0633\u062a\u0648\u0649</span>\n    <div class=\"level-pills\">\n      <button class=\"level-pill\" data-level=\"A2\" onclick=\"setLevel('A2')\">A2 <span class=\"level-sub\">Facile \u00b7 \u0633\u0647\u0644</span></button>\n      <button class=\"level-pill\" data-level=\"B1\" onclick=\"setLevel('B1')\">B1 <span class=\"level-sub\">Moyen \u00b7 \u0645\u062a\u0648\u0633\u0637</span></button>\n      <button class=\"level-pill\" data-level=\"B2\" onclick=\"setLevel('B2')\">B2 <span class=\"level-sub\">Difficile \u00b7 \u0635\u0639\u0628</span></button>\n      <button class=\"level-pill\" data-level=\"C1\" onclick=\"setLevel('C1')\">C1 <span class=\"level-sub\">Avanc\u00e9 \u00b7 \u0645\u062a\u0642\u062f\u0645</span></button>\n    </div>\n  </div>\n\n  <div class=\"global-bar-wrap\">\n    <div class=\"global-bar-fill\" id=\"gFill\" style=\"width:0%\"></div>\n  </div>\n\n  <div class=\"grid\" id=\"grid\"></div>\n\n  <div class=\"jour1-wrap\">\n    <div class=\"jour1-header\">\n      <div>\n        <div class=\"jour1-title\">Jour 1 \u2014 Programme progressif</div>\n        <div class=\"jour1-sub\">Du plus simple au plus difficile</div>\n      </div>\n      <span class=\"jour1-pct\" id=\"j1Pct\">0%</span>\n    </div>\n    <div class=\"jour1-bar\"><div class=\"jour1-bar-fill\" id=\"j1Fill\" style=\"width:0%\"></div></div>\n    <ul class=\"jour1-list\" id=\"jour1List\"></ul>\n  </div>\n\n  <footer class=\"footer\">\n    <span class=\"footer-summary\" id=\"fSummary\">0 / 16 t\u00e2ches compl\u00e9t\u00e9es</span>\n    <div class=\"footer-right\">\n      <button class=\"icon-btn\" id=\"btnReport\" title=\"Rapport journalier\" onclick=\"toggleReport()\" aria-label=\"Afficher le rapport\">\n        <i class=\"ti ti-chart-bar\" aria-hidden=\"true\"></i>\n      </button>\n      <button class=\"icon-btn\" title=\"T\u00e9l\u00e9charger\" onclick=\"downloadState()\" aria-label=\"T\u00e9l\u00e9charger la progression\">\n        <i class=\"ti ti-download\" aria-hidden=\"true\"></i>\n      </button>\n      <button class=\"btn-reset\" onclick=\"resetAll()\">R\u00e9initialiser</button>\n    </div>\n  </footer>\n\n  <div id=\"reportPanel\" style=\"display:none\"></div>\n\n</main>\n\n<div class=\"toast\" id=\"toast\">\n  <i class=\"ti ti-clock\" aria-hidden=\"true\"></i>\n  <span id=\"toastMsg\"></span>\n</div>\n\n<script>\n/* \u2500\u2500 Level control \u2500\u2500 */\nlet currentLevel = localStorage.getItem(\"dt_level\") || \"B1\";\n\nfunction setLevel(level) {\n  currentLevel = level;\n  localStorage.setItem(\"dt_level\", level);\n  document.querySelectorAll(\".level-pill\").forEach(btn => {\n    btn.classList.toggle(\"active\", btn.dataset.level === level);\n  });\n  render();\n  showToast(\"Niveau \" + level + \" aktiviert \u00b7 \u062a\u0645 \u0627\u062e\u062a\u064a\u0627\u0631 \u0627\u0644\u0645\u0633\u062a\u0648\u0649 \" + level);\n}\n\nfunction initLevel() {\n  document.querySelectorAll(\".level-pill\").forEach(btn => {\n    btn.classList.toggle(\"active\", btn.dataset.level === currentLevel);\n  });\n}\n\nfunction buildGptPrompt(taskText, axLabel) {\n  const [de] = taskText.split('\\n');\n  const lvl = currentLevel;\n  const levelDesc = { A2: \"A2 (einfach, kurze S\u00e4tze)\", B1: \"B1 (mittelschwer, allt\u00e4gliche Themen)\", B2: \"B2 (fortgeschritten, komplexe Texte)\", C1: \"C1 (sehr fortgeschritten, akademisch und idiomatisch)\" }[lvl] || \"B1\";\n\n  const prompts = {\n    \"Lesen\": `Du bist mein Deutschlehrer. Mein aktuelles Niveau ist ${levelDesc}. Meine Aufgabe ist: \"${de}\". Bitte gib mir einen Text passend zu meinem Niveau ${lvl}, erkl\u00e4re mir die schwierigen W\u00f6rter auf Deutsch, und stelle mir danach Verst\u00e4ndnisfragen auf Deutsch passend zu ${lvl}. Fang jetzt an!`,\n    \"Schreiben\": `Du bist mein Deutschlehrer. Mein aktuelles Niveau ist ${levelDesc}. Meine Aufgabe ist: \"${de}\". Gib mir ein konkretes Beispiel passend zu ${lvl}, korrigiere meine Fehler wenn ich etwas schreibe, und stelle mir Schreib\u00fcbungen auf Deutsch passend zu ${lvl}. Fang jetzt an!`,\n    \"H\u00f6ren\": `Du bist mein Deutschlehrer. Mein aktuelles Niveau ist ${levelDesc}. Meine Aufgabe ist: \"${de}\". Gib mir einen kurzen H\u00f6rtext (wie einen Podcast oder ein Lied) passend zu ${lvl}, erkl\u00e4re die schwierigen W\u00f6rter auf Deutsch, und stelle mir Verst\u00e4ndnisfragen auf Deutsch passend zu ${lvl}. Fang jetzt an!`,\n    \"Sprechen\": `Du bist mein Deutschlehrer. Mein aktuelles Niveau ist ${levelDesc}. Meine Aufgabe ist: \"${de}\". Starte eine Konversations\u00fcbung mit mir passend zu ${lvl}: stelle mir Fragen auf Deutsch, gib mir S\u00e4tze zum Wiederholen, und korrigiere meine Antworten. Fang jetzt an!`,\n  };\n  return prompts[axLabel] || `Du bist mein Deutschlehrer. Mein Niveau ist ${lvl}. Meine Aufgabe ist: \"${de}\". Hilf mir jetzt auf Deutsch passend zu meinem Niveau. Fang jetzt an!`;\n}\n\n/* \u2500\u2500 ChatGPT integration \u2500\u2500 */\nfunction openGpt(taskText, axLabel, event) {\n  event.stopPropagation();\n  event.preventDefault();\n  const prompt = buildGptPrompt(taskText, axLabel);\n  const url = \"https://chatgpt.com/?q=\" + encodeURIComponent(prompt);\n  window.open(url, \"_blank\", \"noopener\");\n}\n\nconst GPT_ICON = `<svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M22.28 9.28a5.76 5.76 0 0 0-.49-4.73 5.83 5.83 0 0 0-6.27-2.79A5.76 5.76 0 0 0 11.17 0a5.83 5.83 0 0 0-5.56 4.03 5.76 5.76 0 0 0-3.84 2.79 5.83 5.83 0 0 0 .72 6.82 5.76 5.76 0 0 0 .49 4.74 5.83 5.83 0 0 0 6.27 2.78A5.76 5.76 0 0 0 12.83 24a5.83 5.83 0 0 0 5.56-4.03 5.76 5.76 0 0 0 3.84-2.79 5.83 5.83 0 0 0-.72-6.82l-.23.92zM12.83 22.44a4.32 4.32 0 0 1-2.77-1c.03-.02.09-.05.13-.07l4.6-2.66a.75.75 0 0 0 .38-.65v-6.5l1.95 1.12a.07.07 0 0 1 .04.05v5.38a4.34 4.34 0 0 1-4.33 4.33zm-9.3-3.98a4.32 4.32 0 0 1-.52-2.9l.13.08 4.6 2.66a.75.75 0 0 0 .75 0l5.62-3.24v2.24a.07.07 0 0 1-.03.06l-4.65 2.69a4.34 4.34 0 0 1-5.9-1.59zm-1.21-10.05a4.32 4.32 0 0 1 2.26-1.9v5.47a.75.75 0 0 0 .38.65l5.62 3.24-1.95 1.13a.07.07 0 0 1-.07 0L4.01 14.3a4.34 4.34 0 0 1-1.69-5.9zm16.02 3.73-5.62-3.24 1.95-1.12a.07.07 0 0 1 .07 0l4.55 2.63a4.33 4.33 0 0 1-.67 7.81v-5.47a.75.75 0 0 0-.38-.65l.1.04zm1.94-2.91-.13-.08-4.6-2.65a.75.75 0 0 0-.75 0L9.18

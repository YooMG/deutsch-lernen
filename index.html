 \u0627\u0644\u062a\u0631\u062c\u0645\u0629 \u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064a\u0629 \u0644\u0641\u064a\u062f\u064a\u0648 \u0639\u0644\u0649 \u064a\u0648\u062a\u064a\u0648\u0628\", dur: \"10 min\" },\n      { text: \"Identifiziere und notiere 5 neue W\u00f6rter mit ihrem Kontext\\n\u062d\u062f\u062f \u0648\u0633\u062c\u0651\u0644 5 \u0643\u0644\u0645\u0627\u062a \u062c\u062f\u064a\u062f\u0629 \u0645\u0639 \u0633\u064a\u0627\u0642\u0647\u0627\", dur: \"5 min\" },\n      { text: \"Lies 1 Absatz laut vor und achte auf Intonation und Rhythmus\\n\u0627\u0642\u0631\u0623 \u0641\u0642\u0631\u0629 \u0628\u0635\u0648\u062a \u0639\u0627\u0644\u064d \u0645\u0639 \u0627\u0644\u0627\u0646\u062a\u0628\u0627\u0647 \u0644\u0644\u062a\u0646\u063a\u064a\u0645 \u0648\u0627\u0644\u0625\u064a\u0642\u0627\u0639\", dur: \"5 min\" },\n    ],\n    schreiben: [\n      { text: \"Schreibe ein Tagebuch mit 5\u201310 S\u00e4tzen \u00fcber deinen Tag auf Deutsch\\n\u0627\u0643\u062a\u0628 \u064a\u0648\u0645\u064a\u0627\u062a\u0643 \u0628\u0640 5-10 \u062c\u0645\u0644 \u0639\u0646 \u064a\u0648\u0645\u0643 \u0628\u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064a\u0629\", dur: \"10 min\" },\n      { text: \"Lerne 5 neue W\u00f6rter und schreibe sie in einem originellen Satz\\n\u062a\u0639\u0644\u0645 5 \u0643\u0644\u0645\u0627\u062a \u062c\u062f\u064a\u062f\u0629 \u0648\u0627\u0643\u062a\u0628\u0647\u0627 \u0641\u064a \u062c\u0645\u0644\u0629 \u0645\u0646 \u0625\u0628\u062f\u0627\u0639\u0643\", dur: \"10 min\" },\n      { text: \"Schreibe 1 komplexen Satz aus deiner Lekt\u00fcre vereinfacht um\\n\u0623\u0639\u062f \u0643\u062a\u0627\u0628\u0629 \u062c\u0645\u0644\u0629 \u0645\u0639\u0642\u062f\u0629 \u0645\u0646 \u0642\u0631\u0627\u0621\u062a\u0643 \u0628\u0623\u0633\u0644\u0648\u0628 \u0645\u0628\u0633\u0637\", dur: \"5 min\" },\n      { text: \"Schicke 1 Nachricht an einen Sprachpartner oder ChatGPT auf Deutsch\\n\u0623\u0631\u0633\u0644 \u0631\u0633\u0627\u0644\u0629 \u0644\u0634\u0631\u064a\u0643 \u0644\u063a\u0648\u064a \u0623\u0648 ChatGPT \u0628\u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064a\u0629\", dur: \"5 min\" },\n    ],\n    horen: [\n      { text: \"H\u00f6re 1 langsamen Podcast (Slow German, DW f\u00fcr Anf\u00e4nger)\\n\u0627\u0633\u062a\u0645\u0639 \u0625\u0644\u0649 \u0628\u0648\u062f\u0643\u0627\u0633\u062a \u0628\u0637\u064a\u0621 (Slow German \u0623\u0648 DW \u0644\u0644\u0645\u0628\u062a\u062f\u0626\u064a\u0646)\", dur: \"15 min\" },\n      { text: \"Schau 5 Min einer Serie mit deutschen Untertiteln\\n\u0634\u0627\u0647\u062f 5 \u062f\u0642\u0627\u0626\u0642 \u0645\u0646 \u0645\u0633\u0644\u0633\u0644 \u0645\u0639 \u062a\u0631\u062c\u0645\u0629 \u0623\u0644\u0645\u0627\u0646\u064a\u0629\", dur: \"10 min\" },\n      { text: \"H\u00f6re 1 schwierigen Ausschnitt 2\u20133 Mal und notiere, was du verstehst\\n\u0623\u0639\u062f \u0627\u0644\u0627\u0633\u062a\u0645\u0627\u0639 \u0644\u0645\u0642\u0637\u0639 \u0635\u0639\u0628 2-3 \u0645\u0631\u0627\u062a \u0648\u0633\u062c\u0651\u0644 \u0645\u0627 \u0641\u0647\u0645\u062a\u0647\", dur: \"5 min\" },\n      { text: \"H\u00f6re ein deutsches Lied und suche den Liedtext\\n\u0627\u0633\u062a\u0645\u0639 \u0644\u0623\u063a\u0646\u064a\u0629 \u0623\u0644\u0645\u0627\u0646\u064a\u0629 \u0648\u0627\u0628\u062d\u062b \u0639\u0646 \u0643\u0644\u0645\u0627\u062a\u0647\u0627\", dur: \"5 min\" },\n    ],\n    sprechen: [\n      { text: \"Sprich 5 Min allein: beschreibe deinen Tag oder einen Gegenstand um dich\\n\u062a\u062d\u062f\u062b 5 \u062f\u0642\u0627\u0626\u0642 \u0644\u0648\u062d\u062f\u0643: \u0635\u0641 \u064a\u0648\u0645\u0643 \u0623\u0648 \u0634\u064a\u0626\u0627\u064b \u062d\u0648\u0644\u0643\", dur: \"5 min\" },\n      { text: \"Wiederhole die S\u00e4tze deines Podcasts oder deiner Serie laut (Shadowing)\\n\u0643\u0631\u0631 \u062c\u0645\u0644 \u0627\u0644\u0628\u0648\u062f\u0643\u0627\u0633\u062a \u0623\u0648 \u0627\u0644\u0645\u0633\u0644\u0633\u0644 \u0628\u0635\u0648\u062a \u0639\u0627\u0644\u064d (Shadowing)\", dur: \"10 min\" },\n      { text: \"Nimm 1 Sprachnachricht auf und h\u00f6re sie dir an, um die Aussprache zu korrigieren\\n\u0633\u062c\u0651\u0644 \u0631\u0633\u0627\u0644\u0629 \u0635\u0648\u062a\u064a\u0629 \u0648\u0623\u0639\u062f \u0627\u0644\u0627\u0633\u062a\u0645\u0627\u0639 \u0644\u062a\u0635\u062d\u064a\u062d \u0646\u0637\u0642\u0643\", dur: \"5 min\" },\n      { text: \"Mache 1 Austauschsession auf Tandem / HelloTalk (oder mit ChatGPT Sprache)\\n\u0623\u062c\u0631\u0650 \u062c\u0644\u0633\u0629 \u062a\u0628\u0627\u062f\u0644 \u0639\u0644\u0649 Tandem / HelloTalk \u0623\u0648 \u0645\u0639 ChatGPT \u0627\u0644\u0635\u0648\u062a\u064a\", dur: \"15 min\" },\n    ],\n  },\n  B2: {\n    lesen: [\n      { text: \"Lies 1 langen Artikel (B2) aus einer deutschen Zeitung (Spiegel, Zeit\u2026)\\n\u0627\u0642\u0631\u0623 \u0645\u0642\u0627\u0644\u0627\u064b \u0637\u0648\u064a\u0644\u0627\u064b (B2) \u0645\u0646 \u062c\u0631\u064a\u062f\u0629 \u0623\u0644\u0645\u0627\u0646\u064a\u0629 (Spiegel\u060c Zeit...)\", dur: \"20 min\" },\n      { text: \"Analysiere die Argumentation eines deutschen Meinungsartikels\\n\u062d\u0644\u0651\u0644 \u062d\u062c\u062c \u0645\u0642\u0627\u0644 \u0631\u0623\u064a \u0623\u0644\u0645\u0627\u0646\u064a\", dur: \"10 min\" },\n      { text: \"Notiere 7 neue W\u00f6rter mit Synonymen und Antonyme\\n\u0633\u062c\u0651\u0644 7 \u0643\u0644\u0645\u0627\u062a \u062c\u062f\u064a\u062f\u0629 \u0645\u0639 \u0645\u062a\u0631\u0627\u062f\u0641\u0627\u062a\u0647\u0627 \u0648\u0623\u0636\u062f\u0627\u062f\u0647\u0627\", dur: \"5 min\" },\n      { text: \"Lies 1 komplexen Absatz laut vor \u2014 mit nat\u00fcrlichem Tempo\\n\u0627\u0642\u0631\u0623 \u0641\u0642\u0631\u0629 \u0645\u0639\u0642\u062f\u0629 \u0628\u0635\u0648\u062a \u0639\u0627\u0644\u064d \u2014 \u0628\u0625\u064a\u0642\u0627\u0639 \u0637\u0628\u064a\u0639\u064a\", dur: \"5 min\" },\n    ],\n    schreiben: [\n      { text: \"Schreibe einen strukturierten Text (Einleitung, Hauptteil, Schluss) zu einem aktuellen Thema\\n\u0627\u0643\u062a\u0628 \u0646\u0635\u0627\u064b \u0645\u0646\u0638\u0645\u0627\u064b (\u0645\u0642\u062f\u0645\u0629\u060c \u0635\u0644\u0628\u060c \u062e\u0627\u062a\u0645\u0629) \u062d\u0648\u0644 \u0645\u0648\u0636\u0648\u0639 \u0631\u0627\u0647\u0646\", dur: \"15 min\" },\n      { text: \"Schreibe 5 neue komplexe W\u00f6rter mit Nebens\u00e4tzen\\n\u0627\u0643\u062a\u0628 5 \u0643\u0644\u0645\u0627\u062a \u0645\u0639\u0642\u062f\u0629 \u062c\u062f\u064a\u062f\u0629 \u0645\u0639 \u062c\u0645\u0644 \u0641\u0631\u0639\u064a\u0629\", dur: \"10 min\" },\n      { text: \"\u00dcberarbeite und verbessere einen deiner fr\u00fcheren Texte\\n\u0631\u0627\u062c\u0639 \u0648\u062d\u0633\u0651\u0646 \u0623\u062d\u062f \u0646\u0635\u0648\u0635\u0643 \u0627\u0644\u0633\u0627\u0628\u0642\u0629\", dur: \"5 min\" },\n      { text: \"Schreibe eine formelle E-Mail oder einen Brief auf Deutsch\\n\u0627\u0643\u062a\u0628 \u0628\u0631\u064a\u062f\u0627\u064b \u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a\u0627\u064b \u0631\u0633\u0645\u064a\u0627\u064b \u0623\u0648 \u0631\u0633\u0627\u0644\u0629 \u0628\u0627\u0644\u0623\u0644\u0645\u0627\u0646\u064a\u0629\", dur: \"10 min\" },\n    ],\n    horen: [\n      { text: \"H\u00f6re 1 normales deutsches Radio oder Podcast ohne Untertitel (20 Min)\\n\u0627\u0633\u062a\u0645\u0639 \u0644\u0631\u0627\u062f\u064a\u0648 \u0623\u0644\u0645\u0627\u0646\u064a \u0639\u0627\u062f\u064a \u0623\u0648 \u0628\u0648\u062f\u0643\u0627\u0633\u062a \u0628\u062f\u0648\u0646 \u062a\u0631\u062c\u0645\u0629 (20 \u062f\u0642)\", dur: \"20 min\" },\n      { text: \"Schau 10 Min einer deutschen Serie ohne Untertitel\\n\u0634\u0627\u0647\u062f 10 \u062f\u0642\u0627\u0626\u0642 \u0645\u0646 \u0645\u0633\u0644\u0633\u0644 \u0623\u0644\u0645\u0627\u0646\u064a \u0628\u062f\u0648\u0646 \u062a\u0631\u062c\u0645\u0629\", dur: \"10 min\" },\n      { text: \"Transkribiere 1 Minute eines schwierigen H\u00f6rtextes\\n\u0627\u0646\u0633\u062e \u062f\u0642\u064a\u0642\u0629 \u0645\u0646 \u0646\u0635 \u0627\u0633\u062a\u0645\u0627\u0639 \u0635\u0639\u0628 \u0643\u062a\u0627\u0628\u064a\u0627\u064b\", dur: \"10 min\" },\n      { text: \"H\u00f6re ein deutsches Interview und fasse den Inhalt zusammen\\n\u0627\u0633\u062a\u0645\u0639 \u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0623\u0644\u0645\u0627\u0646\u064a\u0629 \u0648\u0644\u062e\u0651\u0635 \u0645\u062d\u062a\u0648\u0627\u0647\u0627\", dur: \"5 min\" },\n    ],\n    sprechen: [\n      { text: \"Diskutiere 10 Min ein aktuelles Thema mit dir selbst (Pro und Kontra)\\n\u0646\u0627\u0642\u0634 \u0645\u0648\u0636\u0648\u0639\u0627\u064b \u0631\u0627\u0647\u0646\u0627\u064b \u0644\u0645\u062f\u0629 10 \u062f\u0642\u0627\u0626\u0642 \u0645\u0639 \u0646\u0641\u0633\u0643 (\u0645\u0639 \u0648\u0636\u062f)\", dur: \"10 min\" },\n      { text: \"Halte eine kurze Pr\u00e4sentation (2\u20133 Min) \u00fcber ein beliebiges Thema\\n\u0623\u0644\u0642\u0650 \u0639\u0631\u0636\u0627\u064b \u0642\u0635\u064a\u0631\u0627\u064b (2-3 \u062f\u0642) \u062d\u0648\u0644 \u0645\u0648\u0636\u0648\u0639 \u062a\u062e\u062a\u0627\u0631\u0647\", dur: \"10 min\" },\n      { text: \"Nimm dich auf und analysiere: Tempo, Aussprache, Grammatikfehler\\n\u0633\u062c\u0651\u0644 \u0646\u0641\u0633\u0643 \u0648\u062d\u0644\u0651\u0644: \u0627\u0644\u0633\u0631\u0639\u0629\u060c \u0627\u0644\u0646\u0637\u0642\u060c \u0623\u062e\u0637\u0627\u0621 \u0627\u0644\u0642\u0648\u0627\u0639\u062f\", dur: \"5 min\" },\n      { text: \"F\u00fchre ein komplexes Gespr\u00e4ch mit ChatGPT zu einem aktuellen Thema\\n\u0623\u062c\u0631\u0650 \u0645\u062d\u0627\u062f\u062b\u0629 \u0645\u0639\u0642\u062f\u0629 \u0645\u0639 ChatGPT \u062d\u0648\u0644 \u0645\u0648\u0636\u0648\u0639 \u0631\u0627\u0647\u0646\", dur: \"15 min\" },\n    ],\n  },\n  C1: {\n    lesen: [\n      { text: \"Lies 1 anspruchsvollen Artikel (Feuilleton, Wissenschaft, Politik) und analysiere die Argumentation\\n\u0627\u0642\u0631\u0623 \u0645\u0642\u0627\u0644\u0627\u064b \u0645\u062a\u0637\u0648\u0631\u0627\u064b (\u062b\u0642\u0627\u0641\u0629\u060c \u0639\u0644\u0648\u0645\u060c \u0633\u064a\u0627\u0633\u0629) \u0648\u062d\u0644\u0651\u0644 \u062d\u062c\u062c\u0647\", dur: \"20 min\" },\n      { text: \"Lies einen literarischen Text und interpretiere Stil, Ton und Absicht des Autors\\n\u0627\u0642\u0631\u0623 \u0646\u0635\u0627\u064b \u0623\u062f\u0628\u064a\u0627\u064b \u0648\u0641\u0633\u0651\u0631 \u0623\u0633\u0644\u0648\u0628\u0647 \u0648\u0646\u0628\u0631\u062a\u0647 \u0648\u0642\u0635\u062f \u0627\u0644\u0643\u0627\u062a\u0628\", dur: \"15 min\" },\n      { text: \"Notiere 8 pr\u00e4zise W\u00f6rter: Nuancen, Kollokationen, idiomatische Ausdr\u00fccke\\n\u0633\u062c\u0651\u0644 8 \u0643\u0644\u0645\u0627\u062a \u062f\u0642\u064a\u0642\u0629: \u0641\u0631\u0648\u0642 \u062f\u0642\u064a\u0642\u0629\u060c \u062a\u0644\u0627\u0632\u0645\u0627\u062a\u060c \u062a\u0639\u0627\u0628\u064a\u0631 \u0627\u0635\u0637\u0644\u0627\u062d\u064a\u0629\", dur: \"5 min\" },\n      { text: \"Lies einen komplexen Text laut vor \u2014 mit perfekter Intonation und Nat\u00fcrlichkeit\\n\u0627\u0642\u0631\u0623 \u0646\u0635\u0627\u064b \u0645\u0639\u0642\u062f\u0627\u064b \u0628\u0635\u0648\u062a \u0639\u0627\u0644\u064d \u2014 \u0628\u062a\u0646\u063a\u064a\u0645 \u0645\u062b\u0627\u0644\u064a \u0648\u0637\u0628\u064a\u0639\u064a\u0629 \u062a\u0627\u0645\u0629\", dur: \"5 min\" },\n    ],\n    schreiben: [\n      { text: \"Schreibe einen strukturierten Essay (400\u2013500 W\u00f6rter) zu einem kontroversen Thema\\n\u0627\u0643\u062a\u0628 \u0645\u0642\u0627\u0644\u0627\u064b \u0645\u0646\u0638\u0645\u0627\u064b (400-500 \u0643\u0644\u0645\u0629) \u062d\u0648\u0644 \u0645\u0648\u0636\u0648\u0639 \u062c\u062f\u0644\u064a\", dur: \"20 min\" },\n      { text: \"Paraphrasiere und kommentiere einen komplexen Absatz mit eigenen Worten\\n\u0623\u0639\u062f \u0635\u064a\u0627\u063a\u0629 \u0641\u0642\u0631\u0629 \u0645\u0639\u0642\u062f\u0629 \u0648\u0639\u0644\u0651\u0642 \u0639\u0644\u064a\u0647\u0627 \u0628\u0623\u0633\u0644\u0648\u0628\u0643 \u0627\u0644\u062e\u0627\u0635\", dur: \"10 min\" },\n      { text: \"\u00dcberarbeite einen eigenen Text stilistisch: Koh\u00e4renz, Register, Pr\u00e4zision\\n\u0631\u0627\u062c\u0639 \u0646\u0635\u0627\u064b \u062e\u0627\u0635\u0627\u064b \u0628\u0643 \u0623\u0633\u0644\u0648\u0628\u064a\u0627\u064b: \u0627\u0644\u062a\u0645\u0627\u0633\u0643\u060c \u0627\u0644\u0645\u0633\u062a\u0648\u0649 \u0627\u0644\u0644\u063a\u0648\u064a\u060c \u0627\u0644\u062f\u0642\u0629\", dur: \"5 min\" },\n      { text: \"Schreibe eine pr\u00e4zise Zusammenfassung (150 W\u00f6rter) eines komplexen Artikels\\n\u0627\u0643\u062a\u0628 \u0645\u0644\u062e\u0635\u0627\u064b \u062f\u0642\u064a\u0642\u0627\u064b (150 \u0643\u0644\u0645\u0629) \u0644\u0645\u0642\u0627\u0644 \u0645\u0639\u0642\u062f\", dur: \"10 min\" },\n    ],\n    horen: [\n      { text: \"H\u00f6re 1 Radiosendung oder Dokumentation ohne Hilfsmittel (25 Min) und mache Notizen\\n\u0627\u0633\u062a\u0645\u0639 \u0644\u0628\u0631\u0646\u0627\u0645\u062c \u0625\u0630\u0627\u0639\u064a \u0623\u0648 \u0648\u062b\u0627\u0626\u0642\u064a \u0628\u062f\u0648\u0646 \u0645\u0633\u0627\u0639\u062f\u0629 (25 \u062f\u0642) \u0648\u062e\u0630 \u0645\u0644\u0627\u062d\u0638\u0627\u062a\", dur: \"25 min\" },\n      { text: \"Schau 15 Min einer deutschen Serie oder eines Films ohne Untertitel\\n\u0634\u0627\u0647\u062f 15 \u062f\u0642\u064a\u0642\u0629 \u0645\u0646 \u0645\u0633\u0644\u0633\u0644 \u0623\u0648 \u0641\u064a\u0644\u0645 \u0623\u0644\u0645\u0627\u0646\u064a \u0628\u062f\u0648\u0646 \u062a\u0631\u062c\u0645\u0629\", dur: \"15 min\" },\n      { text: \"Transkribiere 2 Minuten eines schnellen, authentischen H\u00f6rtextes pr\u00e4zise\\n\u0627\u0646\u0633\u062e \u062f\u0642\u064a\u0642\u062a\u064a\u0646 \u0645\u0646 \u0646\u0635 \u0627\u0633\u062a\u0645\u0627\u0639 \u0633\u0631\u064a\u0639 \u0648\u0623\u0635\u064a\u0644 \u0628\u062f\u0642\u0629\", dur: \"10 min\" },\n      { text: \"Analysiere den Redestil und die Argumentation eines deutschen Vortrags (TED, Bundestag\u2026)\\n\u062d\u0644\u0651\u0644 \u0623\u0633\u0644\u0648\u0628 \u0627\u0644\u062e\u0637\u0627\u0628 \u0648\u0627\u0644\u062d\u062c\u062c \u0641\u064a \u0645\u062d\u0627\u0636\u0631\u0629 \u0623\u0644\u0645\u0627\u0646\u064a\u0629 (TED\u060c \u0627\u0644\u0628\u0648\u0646\u062f\u0633\u062a\u0627\u063a...)\", dur: \"5 min\" },\n    ],\n    sprechen: [\n      { text: \"Halte ein spontanes Monolog (10 Min) zu einem komplexen Thema ohne Vorbereitung\\n\u0623\u0644\u0642\u0650 \u0645\u0648\u0646\u0648\u0644\u0648\u062c\u0627\u064b \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b (10 \u062f\u0642) \u062d\u0648\u0644 \u0645\u0648\u0636\u0648\u0639 \u0645\u0639\u0642\u062f \u062f\u0648\u0646 \u062a\u062d\u0636\u064a\u0631\", dur: \"10 min\" },\n      { text: \"Simuliere ein formelles Vorstellungsgespr\u00e4ch oder eine Debatte mit ChatGPT auf C1-Niveau\\n\u0645\u062d\u0627\u0643\u0627\u0629 \u0645\u0642\u0627\u0628\u0644\u0629 \u0639\u0645\u0644 \u0631\u0633\u0645\u064a\u0629 \u0623\u0648 \u0646\u0642\u0627\u0634 \u0645\u0639 ChatGPT \u0639\u0644\u0649 \u0645\u0633\u062a\u0648\u0649 C1\", dur: \"15 min\" },\n      { text: \"Nimm 3 Min auf und analysiere: Register, Koh\u00e4renz, Lexik, Grammatik\\n\u0633\u062c\u0651\u0644 3 \u062f\u0642\u0627\u0626\u0642 \u0648\u062d\u0644\u0651\u0644: \u0627\u0644\u0645\u0633\u062a\u0648\u0649 \u0627\u0644\u0644\u063a\u0648\u064a\u060c \u0627\u0644\u062a\u0645\u0627\u0633\u0643\u060c \u0627\u0644\u0645\u0641\u0631\u062f\u0627\u062a\u060c \u0627\u0644\u0642\u0648\u0627\u0639\u062f\", dur: \"5 min\" },\n      { text: \"Erkl\u00e4re ein komplexes Konzept (Philosophie, Wirtschaft, Wissenschaft) klar und pr\u00e4zise\\n\u0627\u0634\u0631\u062d \u0645\u0641\u0647\u0648\u0645\u0627\u064b \u0645\u0639\u0642\u062f\u0627\u064b (\u0641\u0644\u0633\u0641\u0629\u060c \u0627\u0642\u062a\u0635\u0627\u062f\u060c \u0639\u0644\u0648\u0645) \u0628\u0648\u0636\u0648\u062d \u0648\u062f\u0642\u0629\", dur: \"15 min\" },\n    ],\n  },\n};\n\nfunction getAxes() {\n  const tasks = TASKS_BY_LEVEL[currentLevel] || TASKS_BY_LEVEL.B1;\n  return [\n    { key: \"lesen\",     label: \"Lesen\",    sub: \"Lesen \u00b7 \u0627\u0644\u0642\u0631\u0627\u0621\u0629\",           color: \"#7F77DD\", iconBg: \"rgba(127,119,221,0.18)\", pctBg: \"rgba(127,119,221,0.15)\", pctText: \"#a8a2e8\", icon: \"ti-book\",       tasks: tasks.lesen     },\n    { key: \"schreiben\", label: \"Schreiben\",sub: \"Schreiben \u00b7 \u0627\u0644\u0643\u062a\u0627\u0628\u0629\",        color: \"#1D9E75\", iconBg: \"rgba(29,158,117,0.18)\",  pctBg: \"rgba(29,158,117,0.15)\",  pctText: \"#4ec49a\", icon: \"ti-pencil\",     tasks: tasks.schreiben },\n    { key: \"horen\",     label: \"H\u00f6ren\",    sub: \"H\u00f6ren \u00b7 \u0627\u0644\u0627\u0633\u062a\u0645\u0627\u0639\",           color: \"#D85A30\", iconBg: \"rgba(216,90,48,0.18)\",   pctBg: \"rgba(216,90,48,0.15)\",   pctText: \"#e88460\", icon: \"ti-headphones\", tasks: tasks.horen     },\n    { key: \"sprechen\",  label: \"Sprechen\", sub: \"Sprechen \u00b7 \u0627\u0644\u062a\u0639\u0628\u064a\u0631 \u0627\u0644\u0634\u0641\u0647\u064a\", color: \"#D4537E\", iconBg: \"rgba(212,83,126,0.18)\",  pctBg: \"rgba(212,83,126,0.15)\",  pctText: \"#e07da0\", icon: \"ti-microphone\", tasks: tasks.sprechen  },\n  ];\n}\n\n// backward compat \u2014 AXES always reflects current level\nObject.defineProperty(window, 'AXES', { get: () => getAxes() });\n\n// state: { [key]: { done: bool, startedAt: ISO|null, completedAt: ISO|null, elapsed: seconds } }\nlet state = JSON.parse(localStorage.getItem(\"dt_tasks_v3\") || \"{}\");\n// live timers for tasks in progress (checked but not yet done \u2014 we track elapsed while page is open)\nlet timers = {}; // key -> intervalId\nlet reportVisible = false;\n\nfunction save() { try { localStorage.setItem(\"dt_tasks_v3\", JSON.stringify(state)); } catch(e) {} }\n\nfunction getEntry(key, i) {\n  const k = key + \"_\" + i;\n  if (!state[k]) state[k] = { done: false, running: false, startedAt: null, completedAt: null, elapsed: 0 };\n  if (state[k].running === undefined) state[k].running = false;\n  return state[k];\n}\n\nfunction formatTime(secs) {\n  if (secs < 60) return secs + \"s\";\n  const m = Math.floor(secs / 60), s = secs % 60;\n  return m + \"m\" + (s > 0 ? \" \" + s + \"s\" : \"\");\n}\n\nfunction fmtHHMM(iso) {\n  if (!iso) return \"\u2013\";\n  const d = new Date(iso);\n  return d.toLocaleTimeString(\"fr-FR\", { hour: \"2-digit\", minute: \"2-digit\" });\n}\n\nfunction showToast(msg) {\n  const t = document.getElementById(\"toast\");\n  document.getElementById(\"toastMsg\").textContent = msg;\n  t.classList.add(\"show\");\n  setTimeout(() => t.classList.remove(\"show\"), 3000);\n}\n\nfunction startLiveTimer(axKey, i) {\n  const k = axKey + \"_\" + i;\n  if (timers[k]) return;\n  timers[k] = setInterval(() => {\n    const e = state[k];\n    if (!e || !e.running) return;\n    e.elapsed = Math.round((Date.now() - new Date(e.startedAt).getTime()) / 1000);\n    updateTimerBadge(k, e.elapsed, true);\n  }, 1000);\n}\n\nfunction stopLiveTimer(axKey, i) {\n  const k = axKey + \"_\" + i;\n  if (timers[k]) { clearInterval(timers[k]); delete timers[k]; }\n}\n\nfunction updateTimerBadge(k, secs, running) {\n  const el = document.getElementById(\"badge_txt_\" + k);\n  if (el) el.textContent = formatTime(secs);\n}\n\nfunction toggle(axKey, i) {\n  const k = axKey + \"_\" + i;\n  const e = getEntry(axKey, i);\n\n  if (e.done) {\n    // already done \u2192 reset\n    e.done = false;\n    e.completedAt = null;\n    e.elapsed = 0;\n    e.startedAt = null;\n    e.running = false;\n    stopLiveTimer(axKey, i);\n    save(); render(); if (reportVisible) renderReport();\n    return;\n  }\n\n  if (!e.running && !e.startedAt) {\n    // STATE 1: idle \u2192 start timer\n    e.startedAt = new Date().toISOString();\n    e.running = true;\n    startLiveTimer(axKey, i);\n    save(); render(); if (reportVisible) renderReport();\n    showToast(\"\u23f1 \u0628\u062f\u0623 \u0627\u0644\u062a\u0627\u064a\u0645\u0631 \u2014 Chrono d\u00e9marr\u00e9 !\");\n    return;\n  }\n\n  if (e.running) {\n    // STATE 2: running \u2192 show \"finish\" button (handled by finishTask)\n    // clicking the task itself while running does nothing (use the finish button)\n    return;\n  }\n}\n\nfunction finishTask(axKey, i, event) {\n  event.stopPropagation();\n  const k = axKey + \"_\" + i;\n  const e = getEntry(axKey, i);\n  if (!e.running) return;\n  e.done = true;\n  e.running = false;\n  e.completedAt = new Date().toISOString();\n  e.elapsed = Math.round((Date.now() - new Date(e.startedAt).getTime()) / 1000);\n  stopLiveTimer(axKey, i);\n  save(); render(); if (reportVisible) renderReport();\n  showToast(\"\u2705 \u0645\u0647\u0645\u0629 \u0645\u0646\u062c\u0632\u0629! \u2014 T\u00e2che termin\u00e9e !\");\n}\n\nfunction getProg(key) {\n  const ax = AXES.find(a => a.key === key);\n  let done = 0;\n  ax.tasks.forEach((_, i) => { if (getEntry(key, i).done) done++; });\n  return { done, total: ax.tasks.length };\n}\n\nfunction render() {\n  const grid = document.getElementById(\"grid\");\n  grid.innerHTML = \"\";\n  let totalDone = 0, totalAll = 0;\n\n  AXES.forEach(ax => {\n    const { done, total } = getProg(ax.key);\n    totalDone += done; totalAll += total;\n    const pct = Math.round(done / total * 100);\n\n    const card = document.createElement(\"div\");\n    card.className = \"card\";\n\n    const taskRows = ax.tasks.map((t, i) => {\n      const k = ax.key + \"_\" + i;\n      const e = getEntry(ax.key, i);\n      const isDone = e.done;\n      const isRunning = e.running && !isDone;\n\n      // timer badge\n      let badgeHtml = \"\";\n      if (isRunning) {\n        const cur = Math.round((Date.now() - new Date(e.startedAt).getTime()) / 1000);\n        badgeHtml = `<span class=\"task-timer-badge running\" id=\"badge_${k}\">\n          <i class=\"ti ti-clock-play\" aria-hidden=\"true\"></i> <span id=\"badge_txt_${k}\">${formatTime(cur)}</span>\n        </span>`;\n      } else if (isDone && e.elapsed) {\n        badgeHtml = `<span class=\"task-timer-badge done-badge\" id=\"badge_${k}\">\n          <i class=\"ti ti-clock-check\" aria-hidden=\"true\"></i> ${formatTime(e.elapsed)}\n        </span>`;\n      }\n\n      // action button\n      let actionBtn = \"\";\n      if (!isDone && !isRunning) {\n        actionBtn = `<button class=\"task-action-btn start-btn\" onclick=\"toggle('${ax.key}',${i});event.stopPropagation()\" title=\"\u0627\u0628\u062f\u0623 \u0627\u0644\u0645\u0647\u0645\u0629\">\n          <i class=\"ti ti-player-play\" aria-hidden=\"true\"></i> \u0627\u0628\u062f\u0623 \u00b7 Start\n        </button>`;\n      } else if (isRunning) {\n        actionBtn = `<button class=\"task-action-btn finish-btn\" onclick=\"finishTask('${ax.key}',${i},event)\" title=\"\u0623\u0646\u0647\u064a\u062a \u0627\u0644\u0645\u0647\u0645\u0629\">\n          <i class=\"ti ti-check\" aria-hidden=\"true\"></i> \u0623\u0646\u0647\u064a\u062a \u00b7 Fertig!\n        </button>`;\n      }\n\n      const [de, ar] = t.text.split('\\n');\n      const taskDisplay = `<span class=\"task-text\"><span class=\"task-de\">${de}</span><span class=\"task-ar\">${ar}</span></span>`;\n      return `\n        <li class=\"task${isDone ? \" done\" : isRunning ? \" running-task\" : \"\"}\"\n            role=\"checkbox\" aria-checked=\"${isDone}\" tabindex=\"0\"\n            onclick=\"toggle('${ax.key}', ${i})\"\n            onkeydown=\"if(event.key===' '||event.key==='Enter'){event.preventDefault();toggle('${ax.key}',${i})}\">\n          <div class=\"task-check\" style=\"${isDone ? `background:${ax.color};border-color:${ax.color}` : isRunning ? `border-color:${ax.color}` : ''}\">\n            ${isDone ? '<i class=\"ti ti-check\" aria-hidden=\"true\"></i>' : isRunning ? '<i class=\"ti ti-dots\" aria-hidden=\"true\" style=\"color:' + ax.color + ';font-size:9px\"></i>' : ''}\n          </div>\n          <div class=\"task-body\">\n            ${taskDisplay}\n            <div class=\"task-meta-row\">\n              ${badgeHtml}\n              ${actionBtn}\n              <a class=\"task-gpt-btn\" href=\"${'https://chatgpt.com/?q=' + encodeURIComponent(buildGptPrompt(t.text, ax.label))}\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\" title=\"Pratiquer sur ChatGPT\">${GPT_ICON} ChatGPT</a>\n            </div>\n          </div>\n          <span class=\"task-dur\">${t.dur}</span>\n        </li>`;\n    }).join(\"\");\n\n    card.innerHTML = `\n      <div class=\"card-top\">\n        <div class=\"card-icon\" style=\"background:${ax.iconBg}\">\n          <i class=\"ti ${ax.icon}\" style=\"color:${ax.color}\" aria-hidden=\"true\"></i>\n        </div>\n        <div class=\"card-labels\">\n          <div class=\"card-name\">${ax.label}</div>\n          <div class=\"card-sub\">${ax.sub}</div>\n        </div>\n        <span class=\"card-pct\" style=\"background:${ax.pctBg};color:${ax.pctText}\">${pct}%</span>\n      </div>\n      <div class=\"mini-bar\">\n        <div class=\"mini-bar-fill\" style=\"width:${pct}%;background:${ax.color}\"></div>\n      </div>\n      <ul class=\"tasks\">${taskRows}</ul>\n    `;\n\n    grid.appendChild(card);\n  });\n\n  const gPct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;\n  document.getElementById(\"gFill\").style.width = gPct + \"%\";\n  document.getElementById(\"fSummary\").textContent = `${totalDone} / ${totalAll} t\u00e2ches compl\u00e9t\u00e9es`;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   REPORT\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction toggleReport() {\n  reportVisible = !reportVisible;\n  const panel = document.getElementById(\"reportPanel\");\n  const btn = document.getElementById(\"btnReport\");\n  panel.style.display = reportVisible ? \"block\" : \"none\";\n  btn.classList.toggle(\"active\", reportVisible);\n  if (reportVisible) renderReport();\n}\n\nfunction renderReport() {\n  const panel = document.getElementById(\"reportPanel\");\n\n  // Collect all done tasks across axes\n  let totalDone = 0, totalElapsed = 0;\n  let firstTime = null, lastTime = null;\n\n  AXES.forEach(ax => {\n    ax.tasks.forEach((_, i) => {\n      const e = getEntry(ax.key, i);\n      if (e.done) {\n        totalDone++;\n        totalElapsed += e.elapsed || 0;\n        const ct = e.completedAt ? new Date(e.completedAt) : null;\n        if (ct) {\n          if (!firstTime || ct < firstTime) firstTime = ct;\n          if (!lastTime || ct > lastTime) lastTime = ct;\n        }\n      }\n    });\n  });\n\n  const sessionMins = firstTime && lastTime\n    ? Math.max(1, Math.round((lastTime - firstTime) / 60000))\n    : 0;\n\n  const statsHtml = `\n    <div class=\"report-stats\">\n      <div class=\"stat-cell\">\n        <div class=\"stat-label\">T\u00e2ches faites</div>\n        <div class=\"stat-value\">${totalDone}<span class=\"stat-unit\">/ 16</span></div>\n      </div>\n      <div class=\"stat-cell\">\n        <div class=\"stat-label\">Temps actif</div>\n        <div class=\"stat-value\">${Math.round(totalElapsed / 60)}<span class=\"stat-unit\">min</span></div>\n      </div>\n      <div class=\"stat-cell\">\n        <div class=\"stat-label\">Session</div>\n        <div class=\"stat-value\">${sessionMins > 0 ? sessionMins : \"\u2013\"}<span class=\"stat-unit\">${sessionMins > 0 ? \"min\" : \"\"}</span></div>\n      </div>\n    </div>`;\n\n  let sectionsHtml = \"\";\n  let anyDone = false;\n\n  AXES.forEach(ax => {\n    const doneTasks = ax.tasks\n      .map((t, i) => ({ t, i, e: getEntry(ax.key, i) }))\n      .filter(x => x.e.done);\n\n    if (doneTasks.length === 0) return;\n    anyDone = true;\n\n    const rows = doneTasks.map(({ t, e }) => `\n      <div class=\"report-row\">\n        <i class=\"ti ti-check rr-icon\" style=\"color:${ax.color}\" aria-hidden=\"true\"></i>\n        <div class=\"rr-body\">\n          <div class=\"rr-text\">${t.text}</div>\n          <div class=\"rr-meta\">\n            ${e.startedAt ? `<span class=\"rr-chip\"><i class=\"ti ti-player-play\" aria-hidden=\"true\"></i> ${fmtHHMM(e.startedAt)}</span>` : \"\"}\n            ${e.completedAt ? `<span class=\"rr-chip\"><i class=\"ti ti-check\" aria-hidden=\"true\"></i> ${fmtHHMM(e.completedAt)}</span>` : \"\"}\n            ${e.elapsed ? `<span class=\"rr-chip\"><i class=\"ti ti-clock\" aria-hidden=\"true\"></i> ${formatTime(e.elapsed)}</span>` : \"\"}\n          </div>\n        </div>\n      </div>`).join(\"\");\n\n    sectionsHtml += `\n      <div class=\"report-section\">\n        <div class=\"report-section-head\">\n          <span class=\"report-axis-dot\" style=\"background:${ax.color}\"></span>\n          <span class=\"report-axis-name\">${ax.label}</span>\n          <span class=\"report-axis-count\">${doneTasks.length} / ${ax.tasks.length} t\u00e2che${doneTasks.length > 1 ? \"s\" : \"\"}</span>\n        </div>\n        <div class=\"report-rows\">${rows}</div>\n      </div>`;\n  });\n\n  if (!anyDone) {\n    sectionsHtml = `<div class=\"report-empty\">\n      <i class=\"ti ti-clipboard-list\" aria-hidden=\"true\"></i>\n      Aucune t\u00e2che compl\u00e9t\u00e9e pour l'instant.<br>Commence une t\u00e2che pour voir ton rapport ici.\n    </div>`;\n  }\n\n  const today = new Date().toLocaleDateString(\"fr-FR\", { weekday: \"long\", day: \"numeric\", month: \"long\" });\n\n  panel.innerHTML = `\n    <div class=\"report-panel\">\n      <div class=\"report-header\">\n        <div class=\"report-title-row\">\n          <i class=\"ti ti-chart-bar\" style=\"color:#7F77DD;font-size:16px\" aria-hidden=\"true\"></i>\n          <span class=\"report-title\">Rapport journalier</span>\n          <span class=\"report-subtitle\" style=\"margin-left:8px\">${today}</span>\n        </div>\n        <button class=\"report-export\" onclick=\"exportReport()\">\n          <i class=\"ti ti-file-text\" aria-hidden=\"true\"></i> Exporter\n        </button>\n      </div>\n      ${statsHtml}\n      ${sectionsHtml}\n    </div>`;\n}\n\nfunction exportReport() {\n  const lines = [\"RAPPORT JOURNALIER \u2013 Deutsch lernen\", \"=\" .repeat(46), \"\"];\n  const today = new Date().toLocaleDateString(\"fr-FR\", { weekday: \"long\", day: \"numeric\", month: \"long\", year: \"numeric\" });\n  lines.push(\"Date : \" + today, \"\");\n\n  let totalDone = 0, totalElapsed = 0;\n\n  AXES.forEach(ax => {\n    const doneTasks = ax.tasks\n      .map((t, i) => ({ t, i, e: getEntry(ax.key, i) }))\n      .filter(x => x.e.done);\n\n    if (doneTasks.length === 0) return;\n    lines.push(`\u25b8 ${ax.label} (${doneTasks.length}/${ax.tasks.length})`);\n    doneTasks.forEach(({ t, e }) => {\n      totalDone++;\n      totalElapsed += e.elapsed || 0;\n      const start = e.startedAt ? fmtHHMM(e.startedAt) : \"\u2013\";\n      const end   = e.completedAt ? fmtHHMM(e.completedAt) : \"\u2013\";\n      const dur   = e.elapsed ? formatTime(e.elapsed) : \"\u2013\";\n      lines.push(`  \u2713 ${t.text}`);\n      lines.push(`    D\u00e9but\u00e9 : ${start}  |  Termin\u00e9 : ${end}  |  Dur\u00e9e : ${dur}`);\n    });\n    lines.push(\"\");\n  });\n\n  lines.push(\"-\".repeat(46));\n  lines.push(`Total : ${totalDone}/16 t\u00e2ches  |  Temps actif : ${Math.round(totalElapsed/60)} min`);\n\n  const blob = new Blob([lines.join(\"\\n\")], { type: \"text/plain;charset=utf-8\" });\n  const a = document.createElement(\"a\");\n  const dateStr = new Date().toISOString().slice(0, 10);\n  a.href = URL.createObjectURL(blob);\n  a.download = `rapport-deutsch-${dateStr}.txt`;\n  a.click();\n}\n\nfunction resetAll() {\n  if (!confirm(\"R\u00e9initialiser toutes les t\u00e2ches et chronom\u00e8tres ?\")) return;\n  Object.keys(timers).forEach(k => clearInterval(timers[k]));\n  timers = {};\n  state = {};\n  save();\n  render();\n  if (reportVisible) renderReport();\n}\n\nfunction downloadState() {\n  const data = JSON.stringify({ tasks: state, exportedAt: new Date().toISOString() }, null, 2);\n  const a = document.createElement(\"a\");\n  a.href = \"data:application/json,\" + encodeURIComponent(data);\n  a.download = \"deutsch-progression.json\";\n  a.click();\n}\n\n// Date header\nconst d = new Date();\ndocument.getElementById(\"hDate\").textContent = d.toLocaleDateString(\"fr-FR\", { weekday: \"long\", day: \"numeric\", month: \"long\" });\n\n/* \u2500\u2500 Jour 1 ordered list \u2500\u2500 */\nconst JOUR1 = [\n  { axKey: \"lesen\",     i: 0, dur: \"15 min\" },\n  { axKey: \"horen\",     i: 0, dur: \"15 min\" },\n  { axKey: \"sprechen\",  i: 0, dur: \"5 min\"  },\n  { axKey: \"lesen\",     i: 1, dur: \"10 min\" },\n  { axKey: \"schreiben\", i: 0, dur: \"10 min\" },\n  { axKey: \"sprechen\",  i: 1, dur: \"10 min\" },\n  { axKey: \"lesen\",     i: 2, dur: \"5 min\"  },\n  { axKey: \"horen\",     i: 1, dur: \"10 min\" },\n  { axKey: \"schreiben\", i: 1, dur: \"10 min\" },\n  { axKey: \"horen\",     i: 2, dur: \"5 min\"  },\n  { axKey: \"schreiben\", i: 2, dur: \"5 min\"  },\n  { axKey: \"sprechen\",  i: 2, dur: \"5 min\"  },\n  { axKey: \"lesen\",     i: 3, dur: \"5 min\"  },\n  { axKey: \"horen\",     i: 3, dur: \"5 min\"  },\n  { axKey: \"schreiben\", i: 3, dur: \"5 min\"  },\n  { axKey: \"sprechen\",  i: 3, dur: \"15 min\" },\n];\n\nconst CAT_STYLE = {\n  lesen:     { label: \"Lesen\",     bg: \"rgba(127,119,221,0.18)\", color: \"#a8a2e8\", icon: \"ti-book\"       },\n  schreiben: { label: \"Schreiben\", bg: \"rgba(29,158,117,0.18)\",  color: \"#4ec49a\", icon: \"ti-pencil\"     },\n  horen:     { label: \"H\u00f6ren\",     bg: \"rgba(216,90,48,0.18)\",   color: \"#e88460\", icon: \"ti-headphones\" },\n  sprechen:  { label: \"Sprechen\",  bg: \"rgba(212,83,126,0.18)\",  color: \"#e07da0\", icon: \"ti-microphone\" },\n};\n\nfunction renderJour1() {\n  const ul = document.getElementById(\"jour1List\");\n  ul.innerHTML = \"\";\n  let done = 0;\n\n  JOUR1.forEach(({ axKey, i }, idx) => {\n    const ax = AXES.find(a => a.key === axKey);\n    const taskText = ax.tasks[i].text;\n    const e = getEntry(axKey, i);\n    const isDone = e.done;\n    if (isDone) done++;\n\n    const cs = CAT_STYLE[axKey];\n    const li = document.createElement(\"li\");\n    li.className = \"jour1-item\" + (isDone ? \" done\" : \"\");\n    li.setAttribute(\"role\", \"checkbox\");\n    li.setAttribute(\"aria-checked\", isDone);\n    li.setAttribute(\"tabindex\", \"0\");\n    const [taskDe, taskAr] = taskText.split('\\n');\n    li.innerHTML = `\n      <span class=\"jour1-num\">${idx + 1}</span>\n      <div class=\"jour1-check\" style=\"${isDone ? `background:${ax.color};border-color:${ax.color}` : ''}\">\n        ${isDone ? '<i class=\"ti ti-check\" aria-hidden=\"true\"></i>' : ''}\n      </div>\n      <div class=\"jour1-body\">\n        <div style=\"flex:1;min-width:0;\">\n          <span class=\"jour1-text\">\n            <span class=\"task-de\">${taskDe}</span>\n            <span class=\"task-ar\">${taskAr}</span>\n            <span class=\"jour1-cat\" style=\"background:${cs.bg};color:${cs.color}\">\n              <i class=\"ti ${cs.icon}\" style=\"font-size:10px\" aria-hidden=\"true\"></i>${cs.label}\n            </span>\n          </span>\n          <a class=\"jour1-gpt-btn\" href=\"${'https://chatgpt.com/?q=' + encodeURIComponent(buildGptPrompt(taskText, cs.label))}\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\" title=\"Pratiquer sur ChatGPT\">${GPT_ICON} ChatGPT</a>\n        </div>\n        <span class=\"jour1-dur\">${JOUR1[idx].dur}</span>\n      </div>`;\n    li.onclick = () => { toggle(axKey, i); };\n    li.onkeydown = (ev) => { if (ev.key === \" \" || ev.key === \"Enter\") { ev.preventDefault(); toggle(axKey, i); } };\n    ul.appendChild(li);\n  });\n\n  const pct = Math.round(done / JOUR1.length * 100);\n  document.getElementById(\"j1Pct\").textContent = pct + \"%\";\n  document.getElementById(\"j1Fill\").style.width = pct + \"%\";\n}\n\n// Patch render() to also update jour1\nconst _origRender = render;\nrender = function() { _origRender(); renderJour1(); };\n\n// Restart running timers on page load\nObject.keys(state).forEach(k => {\n  const e = state[k];\n  if (e && e.running && e.startedAt) {\n    const parts = k.split('_');\n    const iStr = parts.pop();\n    const axKey = parts.join('_');\n    startLiveTimer(axKey, parseInt(iStr));\n  }\n});\n\ninitLevel();\nrender();\n<\/script>\n</body>\n</html>\n";

/* ── Spaced Repetition (SM-2 simplified) ── */
const SR_KEY='sr_data_v1';
let srData={};
try{srData=JSON.parse(localStorage.getItem(SR_KEY)||'{}')}catch(e){}
function saveSR(){try{localStorage.setItem(SR_KEY,JSON.stringify(srData))}catch(e){}}
function srToday(){return Math.floor(Date.now()/86400000);}
function srGet(id){return srData[id]||{interval:1,ef:2.5,due:srToday(),reps:0};}
function srUpdate(id,grade){
  /* grade: 0=نسيت, 1=صعب, 2=سهل */
  const today=srToday(), d=srGet(id);
  if(grade===0){d.interval=1;d.reps=0;}
  else if(grade===1){d.interval=Math.max(1,Math.round(d.interval*1.2));d.ef=Math.max(1.3,d.ef-0.15);}
  else{d.ef=Math.min(2.5,d.ef+(0.1*(grade-1)));d.interval=d.reps===0?1:d.reps===1?3:Math.round(d.interval*d.ef);d.reps++;}
  d.due=today+d.interval;
  srData[id]=d;saveSR();
}
function srDueWords(){
  const today=srToday();
  const due=[];
  WORDS.forEach((cat,ci)=>cat.items.forEach((it,i)=>{
    const id=wid(ci,i);
    const d=srGet(id);
    if(d.reps>0&&d.due<=today)due.push({ci,i,it,id});
  }));
  return due;
}
function srDueCount(){return srDueWords().length;}

/* ---- helpers ---- */
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function splitArt(de){const m=de.trim().match(/^(Der|Die|Das)\s+(.+)$/i);return m?{art:m[1].toLowerCase(),rest:m[2]}:null}
function norm(s){return String(s).trim().toLowerCase().replace(/^(der|die|das)\s+/,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,' ')}
function artOf(s){const m=String(s).trim().match(/^(der|die|das)\b/i);return m?m[1].toLowerCase():null}
function checkFull(given,answer){
  // both article and noun must be correct
  const ga=artOf(given), aa=artOf(answer);
  if(aa){ if(ga!==aa) return false; }      // article required and must match
  return norm(given)===norm(answer);        // noun (article-stripped) must match
}

/* words quiz (meaning / artikel / write / fullwrite) */
function wQuiz(m){
  const sel=wSel();
  const modes=[['meaning','المعنى'],['artikel','الأداة der/die/das'],['write','✍ الكتابة'],['fullwrite','✍ الأداة + الكلمة']];
  const bar=`<div class="q-modes fade">${modes.map(([k,l])=>`<button class="pill ${W.qmode===k?'on':''}" data-q="${k}">${l}</button>`).join('')}</div>`;
  // unmastered toggle
  const unknownCount=sel.items.filter(e=>!wIsKnown(e.ci,e.i)).length;
  const unknownToggle=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <button class="pill ${W.onlyUnknown?'on':''}" id="wUnknownToggle" style="background:${W.onlyUnknown?'var(--rust)':''}">
      🎯 الكلمات غير المتقنة فقط (${unknownCount})
    </button>
  </div>`;
  // determine pool + type + minimum for the chosen mode
  let rawPool=sel.items.map(e=>({it:e.it,i:e.i,ci:e.ci}));
  if(W.onlyUnknown) rawPool=rawPool.filter(e=>!wIsKnown(e.ci,e.i));
  let pool,type,minN,err=null;
  if(W.qmode==='artikel'){
    pool=rawPool.map(e=>({...e,p:splitArt(e.it[0])})).filter(x=>x.p);type='wartikel';minN=3;
    if(pool.length<minN)err=W.onlyUnknown?'لا توجد كلمات غير متقنة كافية بأداة':'لا توجد كلمات كافية بأداة ضمن هذا الاختيار';
  } else if(W.qmode==='fullwrite'){
    pool=rawPool.map(e=>({...e,p:splitArt(e.it[0])})).filter(x=>x.p);type='wfullwrite';minN=1;
    if(pool.length<minN)err=W.onlyUnknown?'لا توجد كلمات غير متقنة بأداة':'لا توجد كلمات بأداة ضمن هذا الاختيار';
  } else if(W.qmode==='write'){
    pool=rawPool;type='wwrite';minN=1;
    if(pool.length<minN)err=W.onlyUnknown?'لا توجد كلمات غير متقنة ضمن هذا الاختيار':'لا توجد كلمات ضمن هذا الاختيار';
  } else {
    pool=rawPool;type='wmeaning';minN=4;
    if(pool.length<minN)err=W.onlyUnknown?`تحتاج إلى ٤ كلمات غير متقنة على الأقل (لديك ${unknownCount})`:'تحتاج إلى ٤ كلمات على الأقل للاختبار';
  }
  if(err){m.innerHTML=wHead(sel)+bar+unknownToggle+`<div class="empty"><div class="e">🤏</div>${err}</div>`;bindWQ(m);bindWUnknown(m);return}
  if(!qz){m.innerHTML=wHead(sel)+bar+unknownToggle+setupHTML(pool.length,W.qcount,'كلمة');bindWQ(m);bindWUnknown(m);bindSetup(pool,type,'words');return}
  m.innerHTML=wHead(sel)+bar+unknownToggle+'<div id="qHost"></div>';
  bindWQ(m);bindWUnknown(m);paintQ();
}
function bindWQ(m){m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{W.qmode=b.dataset.q;qz=null;wQuiz(m)})}
function bindWUnknown(m){const b=document.getElementById('wUnknownToggle');if(b)b.onclick=()=>{W.onlyUnknown=!W.onlyUnknown;qz=null;wQuiz(m)}}

/* verbs quiz */
function vQuiz(m){
  const allPool=vScope();
  const unknownPool=allPool.filter(v=>!vIsKnown(v._id));
  const pool=V.onlyUnknown?unknownPool:allPool;
  const modes=[['meaning','المعنى'],['aux','المساعد'],['praep','حرف الجر'],['write','✍ الكتابة']];
  const bar=`<div class="q-modes fade">${modes.map(([k,l])=>`<button class="pill ${V.qmode===k?'on':''}" data-q="${k}">${l}</button>`).join('')}</div>`;
  // unmastered toggle
  const unknownToggle=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <button class="pill ${V.onlyUnknown?'on':''}" id="vUnknownToggle" style="${V.onlyUnknown?'background:var(--rust);border-color:var(--rust)':''}">
      🎯 الأفعال غير المتقنة فقط (${unknownPool.length})
    </button>
  </div>`;
  let qpool,type,err=null;
  if(V.qmode==='praep'){qpool=pool.filter(v=>v.prep);type='vpraep';if(qpool.length<3)err=V.onlyUnknown?'لا توجد أفعال غير متقنة كافية بحرف جر':'لا توجد أفعال كافية بحرف جر ضمن هذه التصفية'}
  else if(V.qmode==='aux'){qpool=pool;type='vaux';if(qpool.length<2)err=V.onlyUnknown?'تحتاج إلى فعلين غير متقنين على الأقل':'تحتاج إلى فعلين على الأقل'}
  else if(V.qmode==='write'){qpool=pool;type='vwrite';if(!qpool.length)err=V.onlyUnknown?'لا توجد أفعال غير متقنة ضمن هذه التصفية':'لا توجد أفعال ضمن هذه التصفية'}
  else {qpool=pool;type='vmeaning';if(qpool.length<4)err=V.onlyUnknown?`تحتاج إلى ٤ أفعال غير متقنة (لديك ${unknownPool.length})`:'تحتاج إلى ٤ أفعال على الأقل'}
  function bindModes(){m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{V.qmode=b.dataset.q;qz=null;vQuiz(m)})}
  function bindVUnknown(){const b=document.getElementById('vUnknownToggle');if(b)b.onclick=()=>{V.onlyUnknown=!V.onlyUnknown;qz=null;vQuiz(m)}}
  if(err){m.innerHTML=bar+unknownToggle+`<div class="empty"><div class="e">🤏</div>${err}</div>`;bindModes();bindVUnknown();return}
  if(!qz){m.innerHTML=bar+unknownToggle+setupHTML(qpool.length,V.qcount,'فعل');bindModes();bindVUnknown();bindSetup(qpool,type,'verbs');return}
  m.innerHTML=bar+unknownToggle+'<div id="qHost"></div>';
  bindModes();bindVUnknown();paintQ();
}

/* ════════ shared quiz engine ════════ */
let qz=null;
function quizPresets(max){const p=[5,10,15,20,25,30,40,50].filter(n=>n<max);p.push(max);return [...new Set(p)]}
function setupHTML(max,cur,unit){
  const presets=quizPresets(max);
  const unitWord=unit==='كلمة'?'كلمة':'فعلاً';
  const customVal=(cur&&!presets.includes(cur))?cur:'';
  return `<div class="q-setup fade"><div class="q-setup-card">
    <div class="qs-icon">🎯</div>
    <div class="qs-lead">كم ${unitWord} تريد الاختبار فيه؟</div>
    <div class="qs-avail">المتاح ضمن اختيارك الحالي: <b>${max}</b> ${unit}</div>
    <div class="count-grid">${presets.map(n=>`<button class="count-btn ${cur===n?'active':''}" data-n="${n}">${n===max?('الكل · '+max):n}</button>`).join('')}</div>
    <div class="count-custom"><span class="cc-lbl">أو عدد مخصّص:</span><input id="customN" type="number" min="1" max="${max}" placeholder="مثال ${Math.min(8,max)}" value="${customVal}"><span class="cc-max">/ ${max}</span></div>
    <button class="btn start" id="startQuiz">ابدأ الاختبار ←</button>
  </div></div>`;
}
function bindSetup(pool,type,section){
  const stateObj=section==='words'?W:V;
  const host=document.getElementById(section==='words'?'wMain':'vMain');
  const rerender=()=>section==='words'?wQuiz(host):vQuiz(host);
  document.querySelectorAll('.count-btn').forEach(b=>b.onclick=()=>{stateObj.qcount=+b.dataset.n;rerender()});
  const ci=document.getElementById('customN');
  if(ci)ci.oninput=()=>{const n=parseInt(ci.value);if(n>0){stateObj.qcount=Math.min(n,pool.length);document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('active'))}};
  document.getElementById('startQuiz').onclick=()=>{
    let count=stateObj.qcount;
    if(ci&&ci.value){const n=parseInt(ci.value);if(n>0)count=Math.min(n,pool.length)}
    if(!count||count<1)count=Math.min(10,pool.length);
    stateObj.qcount=Math.min(count,pool.length);
    qInit(pool,type,stateObj.qcount);
    rerender();
  };
}
function qInit(pool,type,count){
  const n=Math.min(count||pool.length,pool.length);
  const order=shuffle(pool.map((_,i)=>i)).slice(0,n);
  qz={type,pool,poolLen:pool.length,order,pos:0,score:0,locked:false,log:[]};
}
function paintQ(){
  const host=document.getElementById('qHost');if(!host)return;
  if(qz.pos>=qz.order.length)return qResult(host);
  const item=qz.pool[qz.order[qz.pos]];
  const q=buildQ(qz.type,item);
  const prog=Math.round(qz.pos/qz.order.length*100);
  let optsHTML;
  if(q.write){
    optsHTML=`<div class="q-write"><input id="qIn" type="text" placeholder="اكتب هنا…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="qSubmit">تحقّق</button></div><div class="q-fb" id="qFb"></div>`;
  } else {
    optsHTML=`<div class="q-opts">${q.opts.map(o=>`<button class="q-opt ${q.deOpts?'is-de':''}">${esc(o)}</button>`).join('')}</div>`;
  }
  host.innerHTML=`<div class="quiz-wrap fade">
    <div class="q-prog"><i style="width:${prog}%"></i></div>
    <div class="q-card">
      <div class="q-meta">السؤال ${qz.pos+1} من ${qz.order.length}</div>
      <div class="q-prompt ${q.arPrompt?'ar-prompt':''}">${esc(q.prompt)}</div>
      <div class="q-sub">${q.sub}</div>
      ${optsHTML}
      <div class="q-next" id="qNext"></div>
      <div class="q-foot"><span class="q-score">النتيجة: <b id="qScore">${qz.score}</b> / ${qz.order.length}</span>
      <button class="btn ghost" id="qRestart">↺ من جديد</button></div>
    </div></div>`;
  qz.answer=q.answer;qz.locked=false;
  const logAns=(given,ok)=>qz.log.push({item,prompt:q.prompt,answer:q.answer,given,ok,arPrompt:!!q.arPrompt,deAns:!!(q.deOpts||q.write)});
  const isLast=qz.pos>=qz.order.length-1;
  const showNext=()=>{
    const sc=document.getElementById('qScore');if(sc)sc.textContent=qz.score;
    const nx=document.getElementById('qNext');
    nx.innerHTML=`<button class="btn next-btn" id="qNextBtn">${isLast?'عرض النتيجة ←':'السؤال التالي ←'}</button>`;
    const nb=document.getElementById('qNextBtn');nb.focus();
    nb.onclick=()=>{qz.pos++;paintQ()};
  };
  if(q.write){
    const inp=document.getElementById('qIn');inp.focus();
    const submit=()=>{if(qz.locked)return;qz.locked=true;
      const ok=q.strictArticle?checkFull(inp.value,q.answer):(norm(inp.value)===norm(q.answer));
      inp.classList.add(ok?'correct':'wrong');inp.disabled=true;
      const sb=document.getElementById('qSubmit');if(sb)sb.style.display='none';
      const fb=document.getElementById('qFb');
      logAns(inp.value.trim()||'—',ok);
      if(ok){qz.score++;fb.className='q-fb ok';fb.textContent='✓ صحيح';}
      else{fb.className='q-fb no';fb.innerHTML='✗ الصواب: <span class="de">'+esc(q.answer)+'</span>';}
      showNext();};
    document.getElementById('qSubmit').onclick=submit;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){if(qz.locked){const nb=document.getElementById('qNextBtn');if(nb)nb.click()}else submit()}});
  } else {
    host.querySelectorAll('.q-opt').forEach(btn=>btn.onclick=()=>{if(qz.locked)return;qz.locked=true;
      host.querySelectorAll('.q-opt').forEach(b=>{b.classList.add('locked');if(b.textContent===qz.answer)b.classList.add('correct')});
      const ok=btn.textContent===qz.answer;
      logAns(btn.textContent,ok);
      if(ok)qz.score++;else btn.classList.add('wrong');
      showNext();});
  }
  document.getElementById('qRestart').onclick=()=>{qz=null;view==='words'?wQuiz(document.getElementById('wMain')):vQuiz(document.getElementById('vMain'))};
}
function buildQ(type,item){
  if(type==='wmeaning'){const [de,ar]=item.it;const dir=Math.random()<.5;
    if(dir){let o=shuffle(qz.pool.filter(x=>x.it[1]!==ar));let opts=[ar];for(const x of o){if(!opts.includes(x.it[1]))opts.push(x.it[1]);if(opts.length>=4)break}return{prompt:de,sub:'ما معنى الكلمة؟',opts:shuffle(opts),answer:ar,deOpts:false}}
    else{let o=shuffle(qz.pool.filter(x=>x.it[0]!==de));let opts=[de];for(const x of o){if(!opts.includes(x.it[0]))opts.push(x.it[0]);if(opts.length>=4)break}return{prompt:ar,sub:'ما الكلمة الألمانية؟',opts:shuffle(opts),answer:de,deOpts:true,arPrompt:true}}}
  if(type==='wartikel'){const rest=item.p.rest;return{prompt:rest,sub:'ما الأداة الصحيحة؟',opts:['der','die','das'],answer:item.p.art,deOpts:true}}
  if(type==='wwrite'){const [de,ar]=item.it;return{prompt:ar,sub:'اكتب الكلمة بالألمانية (مع الأداة أو بدونها)',write:true,answer:de,arPrompt:true}}
  if(type==='wfullwrite'){const [de,ar]=item.it;return{prompt:ar,sub:'اكتب الأداة + الكلمة معًا (مثال: der Tisch)',write:true,answer:de,arPrompt:true,strictArticle:true}}
  if(type==='vmeaning'){const v=item;let o=shuffle(qz.pool.filter(x=>x.ar!==v.ar));let opts=[v.ar];for(const x of o){if(!opts.includes(x.ar))opts.push(x.ar);if(opts.length>=4)break}return{prompt:v.v,sub:'ما معنى هذا الفعل؟',opts:shuffle(opts),answer:v.ar,deOpts:false}}
  if(type==='vaux'){const v=item;return{prompt:v.v,sub:'ما الفعل المساعد في الزمن التام؟',opts:['haben','sein'],answer:v.aux==='sein'?'sein':'haben',deOpts:true}}
  if(type==='vpraep'){const v=item;const correct=v.prep.split('/')[0].trim().split(' ')[0];
    const COMMON=['an','auf','über','um','mit','nach','vor','für','zu','bei','in','von','aus','gegen','durch','unter'];
    let inV=[...new Set(qz.pool.map(x=>x.prep.split('/')[0].trim().split(' ')[0]).filter(p=>p&&p!==correct))];
    let d=shuffle(inV).concat(shuffle(COMMON.filter(p=>p!==correct&&!inV.includes(p)))).slice(0,3);
    return{prompt:v.v,sub:'أي حرف جر يلازم هذا الفعل؟',opts:shuffle([correct,...d]),answer:correct,deOpts:true}}
  if(type==='vwrite'){const v=item;return{prompt:v.ar,sub:'اكتب الفعل بالألمانية (المصدر)',write:true,answer:v.v,arPrompt:true}}
}
function qResult(host){
  const n=qz.order.length,s=qz.score,pct=Math.round(s/n*100),wrong=n-s;
  const em=pct>=90?'🏆':pct>=70?'🎉':pct>=50?'👍':'📒';
  const msg=pct>=90?'ممتاز! إتقان رائع':pct>=70?'جيد جدًا، واصل':pct>=50?'لا بأس، راجِع أكثر':'تحتاج لمزيد من المراجعة';
  const log=qz.log;
  const rows=log.map((r,idx)=>{
    const pCls=r.arPrompt?'rp-ar':'rp-de';
    const aCls=r.deAns?'de':'';
    const given=r.ok?'':`<div class="rr-given">إجابتك: <span class="${aCls}">${esc(r.given)}</span></div>`;
    return `<div class="rrow ${r.ok?'ok':'no'}">
      <div class="rr-ic">${r.ok?'✓':'✗'}</div>
      <div class="rr-body">
        <div class="rr-q"><span class="rr-num">${idx+1}.</span> <span class="${pCls}">${esc(r.prompt)}</span></div>
        <div class="rr-ans">الصواب: <span class="${aCls}">${esc(r.answer)}</span></div>
        ${given}
      </div></div>`;
  }).join('');
  const reviewBtn=wrong>0?`<button class="btn ghost" id="reviewWrong">🔁 راجع الأخطاء (${wrong})</button>`:'';
  host.innerHTML=`<div class="quiz-wrap fade">
    <div class="q-card">
      <div class="q-result">
        <div class="em">${em}</div><h3>${msg}</h3>
        <div class="sc">أجبت صحيحًا عن <b>${s}</b> من ${n} (${pct}%)</div>
        <div class="rbar"><span class="rb-ok" style="flex:${s||0}"></span><span class="rb-no" style="flex:${wrong||0}"></span></div>
        <div class="rbar-leg"><span><i class="d-ok"></i> صحيحة: ${s}</span><span><i class="d-no"></i> خاطئة: ${wrong}</span></div>
      </div>
      <div class="report">
        <div class="report-hd">تقرير مفصّل · ${n} سؤال</div>
        <div class="report-list">${rows}</div>
      </div>
      <div class="report-actions">
        <button class="btn" id="again">↺ أعِد الاختبار</button>
        ${reviewBtn}
        <button class="btn ghost" id="markCorrect">✓ علّم الصحيحة كمتقَنة (${s})</button>
      </div>
    </div></div>`;
  const back=()=>{qz=null;view==='words'?wQuiz(document.getElementById('wMain')):vQuiz(document.getElementById('vMain'))};
  document.getElementById('again').onclick=back;
  const rw=document.getElementById('reviewWrong');
  if(rw)rw.onclick=()=>{
    const wrongItems=log.filter(r=>!r.ok).map(r=>r.item);
    const order=wrongItems.map(it=>qz.pool.indexOf(it)).filter(i=>i>=0);
    qz={type:qz.type,pool:qz.pool,poolLen:qz.pool.length,order,pos:0,score:0,locked:false,log:[]};
    paintQ();
  };
  const mc=document.getElementById('markCorrect');
  if(mc)mc.onclick=()=>{
    let count=0;
    log.filter(r=>r.ok).forEach(r=>{
      const it=r.item;
      if(view==='words'){const ci=(it.ci!=null?it.ci:W.cat);if(typeof it.i==='number'&&!wIsKnown(ci,it.i)){wToggle(ci,it.i);count++}}
      else{if(it&&typeof it._id==='number'&&!vIsKnown(it._id)){vToggle(it._id);count++}}
    });
    if(view==='words'){renderWSide();updateWStat()}else{renderVSide();updateVStat()}
    mc.textContent=`✓ تم تعليم ${count} كمتقَنة`;mc.disabled=true;mc.style.opacity=.6;
  };
}

function deleteCategory(wordsIdx,customIdx){
  const cat=WORDS[wordsIdx];
  const itemCount=cat.items.length;
  const msg=itemCount>0
    ?`هل أنت متأكد من حذف مجموعة "${cat.ar}"؟\nستُحذف معها ${itemCount} كلمة وكل تقدّمها.`
    :`هل أنت متأكد من حذف مجموعة "${cat.ar}"؟`;
  if(!confirm(msg))return;
  /* remove progress entries for all items in this category */
  cat.items.forEach((_,i)=>{const k=wid(wordsIdx,i);delete wKnown[k]});
  saveW();
  /* remove custom words that belong to this category, update ci for later ones */
  const newWCustom=wCustom.filter(w=>w.ci!==wordsIdx).map(w=>w.ci>wordsIdx?{...w,ci:w.ci-1}:w);
  wCustom.length=0;newWCustom.forEach(w=>wCustom.push(w));
  saveWCustom();
  /* remove from WORDS array */
  WORDS.splice(wordsIdx,1);
  /* remove from wCustomCats */
  wCustomCats.splice(customIdx,1);
  saveWCustomCats();
  /* recalculate total */
  WTOTAL=WORDS.reduce((s,c)=>s+c.items.length,0);
  closeModal();
  W.cat='all';
  if(view==='words')renderWords();
}

  document.getElementById('vCancel').onclick=closeModal;

    const g=id=>document.getElementById(id).value.trim();
    const err=document.getElementById('vErr');
    if(!g('vV')||!g('vAr')){err.textContent='يرجى ملء الفعل والمعنى على الأقل';return}
    addVerb({v:g('vV'),ar:g('vAr'),p2:g('vP2'),aux:g('vAux'),prat:g('vPrat'),case:g('vCase'),prep:g('vPrep'),ex:g('vEx'),exar:g('vExar'),lvl:g('vLvl'),note:g('vNote')});

  };
}

/* ════════ HÖREN — SoundCloud-style Waveform Player ════════ */
let horenTracks=[];
let horenCurrent=-1;
let horenAudio=new Audio();
let horenRaf=null;
let horenFilter='all';
let horenDB=null;
let horenAudioCtx=null;
/* waveform cache: id → Float32Array of ~500 peaks */
const horenWfCache=new Map();

/* ── IndexedDB ── */
function horenOpenDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('horenDB',1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('tracks'))
        db.createObjectStore('tracks',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess=e=>{horenDB=e.target.result;res(horenDB);};
    req.onerror=()=>rej(req.error);
  });
}
function horenDBSave(track){
  return new Promise((res,rej)=>{
    const tx=horenDB.transaction('tracks','readwrite');
    const store=tx.objectStore('tracks');
    const obj={name:track.name,type:track.type,niveau:track.niveau,blob:track.blob};
    let newId;
    const req=track.id?(obj.id=track.id,store.put(obj)):store.add(obj);
    req.onsuccess=e=>{newId=e.target.result;};
    tx.oncomplete=()=>res(newId);
    tx.onerror=()=>rej(tx.error);
  });
}
function horenDBDel(id){return new Promise((res,rej)=>{const tx=horenDB.transaction('tracks','readwrite');tx.objectStore('tracks').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function horenDBClear(){return new Promise((res,rej)=>{const tx=horenDB.transaction('tracks','readwrite');tx.objectStore('tracks').clear().onsuccess=()=>res();tx.onerror=()=>rej(tx.error);});}
function horenDBLoadAll(){return new Promise((res,rej)=>{const tx=horenDB.transaction('tracks','readonly');const req=tx.objectStore('tracks').getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}

/* ── Waveform Analysis ── */
function horenGetCtx(){
  if(!horenAudioCtx||horenAudioCtx.state==='closed')
    horenAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return horenAudioCtx;
}
async function horenAnalyse(track,bars=500){
  if(horenWfCache.has(track.id))return horenWfCache.get(track.id);
  const ctx=horenGetCtx();
  const ab=await track.blob.arrayBuffer();
  const decoded=await ctx.decodeAudioData(ab);
  const raw=decoded.getChannelData(0);
  const step=Math.floor(raw.length/bars);
  const peaks=new Float32Array(bars);
  for(let b=0;b<bars;b++){
    let max=0;
    const start=b*step,end=Math.min(start+step,raw.length);
    for(let j=start;j<end;j++){const v=Math.abs(raw[j]);if(v>max)max=v;}
    peaks[b]=max;
  }
  /* normalise */
  let mx=0;for(let b=0;b<bars;b++)if(peaks[b]>mx)mx=peaks[b];
  if(mx>0)for(let b=0;b<bars;b++)peaks[b]=peaks[b]/mx;
  horenWfCache.set(track.id,peaks);
  return peaks;
}

/* ── Canvas draw ── */
function horenDrawWf(canvasId,peaks,progress,hover=-1){
  const cvs=document.getElementById(canvasId);if(!cvs)return;
  const W=cvs.offsetWidth||cvs.parentElement?.offsetWidth||600;
  const H=cvs.offsetHeight||64;
  cvs.width=W*window.devicePixelRatio;cvs.height=H*window.devicePixelRatio;
  const ctx=cvs.getContext('2d');ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  ctx.clearRect(0,0,W,H);
  const bars=peaks.length;
  const barW=W/bars;
  const isDark=document.body.dataset.theme==='dark';
  const colPlayed=isDark?'#4ba3b3':'#2f7d8a';
  const colUnplayed=isDark?'rgba(255,255,255,0.18)':'rgba(44,42,36,0.18)';
  const colHover=isDark?'rgba(255,255,255,0.30)':'rgba(44,42,36,0.30)';
  const gap=barW>3?1.2:0.6;
  for(let b=0;b<bars;b++){
    const x=b*barW;
    const h=Math.max(2,peaks[b]*(H*0.9));
    const y=(H-h)/2;
    const isPlayed=b/bars<progress;
    const isHov=hover>=0&&Math.abs(b/bars-hover)<0.025;
    ctx.fillStyle=isPlayed?colPlayed:isHov?colHover:colUnplayed;
    ctx.beginPath();
    ctx.roundRect(x+gap/2,y,Math.max(1,barW-gap),h,1.5);
    ctx.fill();
  }
}

function horenFmt(s){if(!s||isNaN(s))return '--:--';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

/* ── Render ── */
function renderHoren(){
  horenOpenDB().then(()=>horenDBLoadAll()).then(rows=>{
    horenTracks=rows.map(r=>({...r,url:URL.createObjectURL(r.blob)}));
    _renderHorenUI();
  }).catch(()=>{horenTracks=[];_renderHorenUI();});
}

function _renderHorenUI(){
  const hasT=horenTracks.length>0;
  const nivs=['A1','A2','B1','B2','C1'];
  const usedNivs=new Set(horenTracks.map(t=>t.niveau||'A2'));
  const tabsHtml=hasT?`<div class="hn-tabs">
    <button class="hn-tab${horenFilter==='all'?' active':''}" onclick="horenSetFilter('all')">🎧 الكل (${horenTracks.length})</button>
    ${nivs.filter(n=>usedNivs.has(n)).map(n=>`<button class="hn-tab${horenFilter===n?' active':''}" onclick="horenSetFilter('${n}')">${n} <span style="font-weight:400;opacity:.7">(${horenTracks.filter(t=>(t.niveau||'A2')===n).length})</span></button>`).join('')}
  </div>`:'';
  app.innerHTML=`<div class="horen-wrap fade">
    <div class="horen-header">
      <div>
        <h2>🎧 Hören <span class="de">· الاستماع</span></h2>
        <p>ارفع ملفات صوتية واستمع مع عرض الموجة الصوتية الحقيقية</p>
      </div>
      ${hasT?`<button onclick="horenDeleteAll()" style="background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:#c0392b;border-radius:10px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🗑️ حذف الكل</button>`:''}
    </div>
    <div class="upload-zone" id="hUpload" role="button" tabindex="0">
      <input type="file" accept="audio/*" multiple id="hFileIn" style="display:none">
      <span class="uz-icon">🎵</span>
      <div>
        <div class="uz-title">انقر أو اسحب ملفات صوتية هنا</div>
        <div class="uz-types">MP3 · M4A · WAV · OGG · FLAC · AAC</div>
      </div>
    </div>
    ${tabsHtml}
    <div id="hPlaylist"></div>
  </div>`;
  const fi=document.getElementById('hFileIn');
  fi.onchange=e=>horenAddFiles(e.target.files);
  const uz=document.getElementById('hUpload');
  uz.onclick=()=>fi.click();
  uz.onkeydown=e=>{if(e.key===' '||e.key==='Enter')fi.click();};
  uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag');});
  uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
  uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag');horenAddFiles(e.dataTransfer.files);});
  horenRenderPlaylist();
}

function horenSetFilter(niv){horenFilter=niv;if(view==='horen')renderHoren();}

function horenAddFiles(files){
  const list=[...(files instanceof FileList?files:[...files])].filter(f=>f.type.startsWith('audio/'));
  if(!list.length)return;
  horenShowNiveauModal(niveau=>{
    const pl=document.getElementById('hPlaylist');
    if(pl)pl.innerHTML=`<div class="horen-empty"><div class="wf-loading"><div class="wf-dots"><span></span><span></span><span></span></div> جارٍ حفظ ${list.length} ملف…</div></div>`;
    horenOpenDB().then(()=>{
      return Promise.allSettled(list.map(f=>{
        const name=f.name.replace(/\.[^.]+$/,'').trim()||f.name;
        return horenDBSave({name,type:f.type,niveau,blob:f});
      }));
    }).then(()=>{horenFilter=niveau;renderHoren();})
    .catch(err=>{const pl=document.getElementById('hPlaylist');if(pl)pl.innerHTML=`<div class="horen-empty"><span class="he-icon">❌</span><p>خطأ في الحفظ</p><span>${err.message||''}</span></div>`;});
  });
}

function horenShowNiveauModal(cb){
  const ov=document.createElement('div');ov.className='modal-ov';
  ov.innerHTML=`<div class="modal" style="max-width:380px;text-align:center">
    <h3>📂 اختر مستوى الملف</h3>
    <div class="m-sub">سيُصنَّف الملف تحت هذا المستوى</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px">
      ${['A1','A2','B1','B2','C1'].map(n=>`<button onclick="horenPickNiv(this,'${n}')" class="btn" style="min-width:56px;padding:10px 0;font-size:16px;font-weight:800">${n}</button>`).join('')}
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov){document.body.removeChild(ov);}});
  window._horenNivCb=cb;window._horenNivOv=ov;
}
function horenPickNiv(btn,niv){document.body.removeChild(window._horenNivOv);window._horenNivCb(niv);}

function horenDeleteAll(){
  if(!confirm('حذف جميع الملفات الصوتية؟'))return;
  horenAudio.pause();cancelAnimationFrame(horenRaf);
  horenTracks.forEach(t=>URL.revokeObjectURL(t.url));
  horenTracks=[];horenCurrent=-1;horenWfCache.clear();
  horenOpenDB().then(()=>horenDBClear()).then(()=>{if(view==='horen')renderHoren();});
}

function horenRenderPlaylist(){
  const pl=document.getElementById('hPlaylist');if(!pl)return;
  const filtered=horenFilter==='all'?horenTracks.map((t,i)=>({t,i})):horenTracks.map((t,i)=>({t,i})).filter(({t})=>(t.niveau||'A2')===horenFilter);
  if(horenTracks.length===0){
    pl.innerHTML=`<div class="horen-empty"><span class="he-icon">🎙️</span><p>لا توجد ملفات بعد</p><span>ارفع ملفًا صوتيًا للبدء</span></div>`;return;
  }
  if(filtered.length===0){
    pl.innerHTML=`<div class="horen-empty"><span class="he-icon">🔍</span><p>لا توجد ملفات بمستوى ${horenFilter}</p></div>`;return;
  }
  pl.innerHTML='';
  filtered.forEach(({t,i})=>{
    const isP=i===horenCurrent;
    const niv=t.niveau||'A2';
    const card=document.createElement('div');
    card.className='sc-card'+(isP?' playing':'');
    card.id='sc-'+i;
    card.innerHTML=`
      <div class="sc-top">
        <div class="sc-art" id="sc-art-${i}">
          🎵
          <div class="sc-art-overlay">
            <span class="sc-art-btn" id="sc-art-btn-${i}">${isP&&!horenAudio.paused?'⏸':'▶'}</span>
          </div>
        </div>
        <div class="sc-right">
          <div class="sc-meta-row">
            <div class="sc-info">
              <div class="sc-artist">${niv} · ${(t.type.split('/')[1]||'Audio').toUpperCase()}</div>
              <div class="sc-title" title="${t.name}">${t.name}</div>
            </div>
            <button class="sc-del" onclick="horenDeleteById(${t.id})" title="حذف">🗑</button>
          </div>
        </div>
      </div>
      <div class="sc-player" id="scplayer-${i}" style="${isP?'':'display:none'}">
        <div class="wf-wrap" id="wf-wrap-${i}">
          <canvas class="wf-canvas" id="wf-${i}"></canvas>
          <div class="wf-loading" id="wf-load-${i}" style="display:none"><div class="wf-dots"><span></span><span></span><span></span></div> تحليل الموجة…</div>
          <div class="wf-time-cursor" id="wf-cur-${i}"></div>
        </div>
        <div class="sc-time-row" dir="ltr"><span id="sc-ct-${i}" style="color:var(--teal);font-weight:700">0:00</span><span id="sc-dur-${i}">--:--</span></div>
        <div class="sc-controls">
          <button class="sc-seek-btn" onclick="horenSeek(${i},-15)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
            <span style="font-size:9px;font-weight:800">15</span>
          </button>
          <button class="sc-play-btn" id="sc-btn-${i}" onclick="horenToggle(${i})">${isP&&!horenAudio.paused?'⏸':'▶'}</button>
          <button class="sc-seek-btn" onclick="horenSeek(${i},15)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
            <span style="font-size:9px;font-weight:800">15</span>
          </button>
          <div class="sc-vol">
            <span class="sc-vol-icon">🔊</span>
            <input type="range" class="sc-vol-slider" min="0" max="1" step="0.05" value="1" oninput="horenAudio.volume=this.value">
          </div>
        </div>
        <div class="sc-bottom-row">
          <div class="sc-speed" dir="ltr">
            ${[0.5,0.75,1,1.25,1.5,2].map(s=>`<button class="sc-speed-btn${s===1?' active':''}" onclick="horenSpeed(${i},${s},this)">${s}×</button>`).join('')}
          </div>
          <button class="hq-btn" onclick="horenOpenQuiz(${i})" id="hq-btn-${i}">
            🎯 أسئلة الاستماع
          </button>
        </div>
        <div class="hq-panel" id="hq-panel-${i}" style="display:none"></div>
      </div>`;

    /* art click = play/toggle */
    card.querySelector('.sc-art').onclick=()=>horenPlay(i);
    /* title row click = expand player */
    card.querySelector('.sc-right').onclick=e=>{if(e.target.closest('.sc-del'))return;horenPlay(i);};

    /* waveform mouse interaction */
    const wfWrap=card.querySelector('.wf-wrap');
    const cursor=card.querySelector('.wf-time-cursor');
    wfWrap.addEventListener('mousemove',e=>{
      const r=wfWrap.getBoundingClientRect();
      const ratio=(e.clientX-r.left)/r.width;
      cursor.style.left=(ratio*100)+'%';
      if(horenWfCache.has(t.id))horenDrawWf('wf-'+i,horenWfCache.get(t.id),horenAudio.duration?horenAudio.currentTime/horenAudio.duration:0,ratio);
    });
    wfWrap.addEventListener('mouseleave',()=>{
      if(horenWfCache.has(t.id))horenDrawWf('wf-'+i,horenWfCache.get(t.id),horenAudio.duration?horenAudio.currentTime/horenAudio.duration:0);
    });
    wfWrap.addEventListener('click',e=>{
      if(horenCurrent!==i||!horenAudio.duration)return;
      const r=wfWrap.getBoundingClientRect();
      const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      horenAudio.currentTime=ratio*horenAudio.duration;
      horenUpdateProgress(i);
    });

    pl.appendChild(card);

    /* if this is the playing track, trigger waveform load */
    if(isP)setTimeout(()=>horenLoadWf(i,t),50);
  });
}

async function horenLoadWf(i,t){
  const loadEl=document.getElementById('wf-load-'+i);
  const cvs=document.getElementById('wf-'+i);
  if(!cvs)return;
  if(horenWfCache.has(t.id)){
    const prog=horenAudio.duration?horenAudio.currentTime/horenAudio.duration:0;
    horenDrawWf('wf-'+i,horenWfCache.get(t.id),prog);
    return;
  }
  if(loadEl)loadEl.style.display='flex';
  try{
    const peaks=await horenAnalyse(t);
    if(loadEl)loadEl.style.display='none';
    const prog=horenAudio.duration?horenAudio.currentTime/horenAudio.duration:0;
    horenDrawWf('wf-'+i,peaks,prog);
  }catch(e){
    if(loadEl){loadEl.innerHTML='<span style="color:var(--ink-soft);font-size:11px">⚠ تعذّر تحليل الموجة</span>';loadEl.style.display='flex';}
  }
}

function horenPlay(i){
  if(horenCurrent===i){horenToggle(i);return;}
  horenAudio.pause();cancelAnimationFrame(horenRaf);
  /* collapse old */
  if(horenCurrent>=0){
    const op=document.getElementById('scplayer-'+horenCurrent);if(op)op.style.display='none';
    const oc=document.getElementById('sc-'+horenCurrent);if(oc)oc.classList.remove('playing');
    const ob=document.getElementById('sc-btn-'+horenCurrent);if(ob)ob.textContent='▶';
    const oab=document.getElementById('sc-art-btn-'+horenCurrent);if(oab)oab.textContent='▶';
  }
  horenCurrent=i;
  const t=horenTracks[i];
  horenAudio.src=t.url;horenAudio.load();horenAudio.play();
  /* show player */
  const np=document.getElementById('scplayer-'+i);if(np)np.style.display='block';
  const nc=document.getElementById('sc-'+i);if(nc)nc.classList.add('playing');
  const nb=document.getElementById('sc-btn-'+i);if(nb)nb.textContent='⏸';
  const nab=document.getElementById('sc-art-btn-'+i);if(nab)nab.textContent='⏸';
  horenAudio.onloadedmetadata=()=>{
    const d=document.getElementById('sc-dur-'+i);if(d)d.textContent=horenFmt(horenAudio.duration);
    horenLoadWf(i,t);
  };
  horenAudio.onended=()=>{
    cancelAnimationFrame(horenRaf);
    const eb=document.getElementById('sc-btn-'+horenCurrent);if(eb)eb.textContent='▶';
    const eab=document.getElementById('sc-art-btn-'+horenCurrent);if(eab)eab.textContent='▶';
    if(horenCurrent+1<horenTracks.length)horenPlay(horenCurrent+1);
  };
  horenRafLoop(i);
}

function horenToggle(i){
  if(horenCurrent!==i){horenPlay(i);return;}
  const btn=document.getElementById('sc-btn-'+i);
  const artBtn=document.getElementById('sc-art-btn-'+i);
  if(horenAudio.paused){
    horenAudio.play();
    if(btn)btn.textContent='⏸';if(artBtn)artBtn.textContent='⏸';
    horenRafLoop(i);
  }else{
    horenAudio.pause();
    if(btn)btn.textContent='▶';if(artBtn)artBtn.textContent='▶';
    cancelAnimationFrame(horenRaf);
  }
}

function horenSeek(i,delta){
  if(horenCurrent!==i)return;
  horenAudio.currentTime=Math.max(0,Math.min(horenAudio.duration||0,horenAudio.currentTime+delta));
  horenUpdateProgress(i);
}

function horenSpeed(i,s,btn){
  horenAudio.playbackRate=s;
  btn.closest('.sc-speed').querySelectorAll('.sc-speed-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function horenUpdateProgress(i){
  const d=horenAudio.duration||0,ct=horenAudio.currentTime||0;
  const prog=d?Math.min(1,ct/d):0;
  const cur=document.getElementById('sc-ct-'+i);if(cur)cur.textContent=horenFmt(ct);
  /* redraw waveform */
  const t=horenTracks[i];
  if(t&&horenWfCache.has(t.id))horenDrawWf('wf-'+i,horenWfCache.get(t.id),prog);
}

function horenRafLoop(i){
  horenRaf=requestAnimationFrame(()=>{horenUpdateProgress(i);if(!horenAudio.paused)horenRafLoop(i);});
}

function horenDeleteById(id){
  const idx=horenTracks.findIndex(t=>t.id===id);if(idx<0)return;
  const t=horenTracks[idx];
  if(!confirm('حذف "'+t.name+'" من القائمة؟'))return;
  URL.revokeObjectURL(t.url);horenWfCache.delete(t.id);
  if(horenCurrent===idx){horenAudio.pause();cancelAnimationFrame(horenRaf);horenCurrent=-1;}
  else if(horenCurrent>idx)horenCurrent--;
  horenTracks.splice(idx,1);
  horenOpenDB().then(()=>horenDBDel(id)).then(()=>{if(view==='horen')horenRenderPlaylist();});
}

function ttsSpeak(text, lang='de-DE'){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;u.rate=0.9;
  const voices=window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('de'));
  if(voices.length)u.voice=voices[0];
  window.speechSynthesis.speak(u);
}
function ttsBtn(text,lang='de-DE'){

}

  const card=document.getElementById('ankiCard');

function ankiAnswer(grade){
  const item=ankiQueue[ankiIdx];
  srUpdate(item.id,grade);
  if(grade===0)ankiSession.forgot++;
  else if(grade===1)ankiSession.hard++;
  else ankiSession.easy++;
  ankiIdx++;
  const m=document.getElementById('wMain');
  ankiPaint(m);
}

function lueckeGenerate(){
  lueckeExercise=[];
  let pool=[];
  if(lueckeSource==='words'){
    WORDS.forEach((cat,ci)=>cat.items.forEach((it,i)=>{
      if(it[0]&&it[1])pool.push({de:it[0],ar:it[1],type:'word'});
    }));
  } else {
    VERBS.forEach((v,i)=>{
      if(v.v&&v.ar)pool.push({de:v.v,ar:v.ar,type:'verb',prat:v.prat||'',aux:v.aux||''});
    });
  }
  if(pool.length<5){
    document.getElementById('lueckeBody').innerHTML=`<div class="luecke-empty">أضف كلمات أو أفعال أولاً لتوليد التمارين</div>`;
    return;
  }
  pool=shuffle([...pool]).slice(0,6);
  lueckeExercise=pool.map(item=>{
    const sentence=lueckeBuildSentence(item);
    return{...item,sentence,answered:false,correct:false};
  });
  lueckeRender();
}

function lueckeBuildSentence(item){
  const templates_word=[
    (w,ar)=>`Das Wort auf Arabisch bedeutet "${ar}": ___`,
    (w,ar)=>`Auf Deutsch heißt "${ar}": ___`,
    (w,ar)=>`___ bedeutet auf Arabisch: ${ar}`,
  ];
  const templates_verb=[
    (v,ar)=>`Das Verb "___ " bedeutet: ${ar}`,
    (v,ar)=>`Auf Arabisch heißt "${ar}" auf Deutsch: ___`,
    (v,ar)=>`Ich kenne dieses Verb: ___ (${ar})`,
  ];
  const templates=item.type==='verb'?templates_verb:templates_word;
  const tpl=templates[Math.floor(Math.random()*templates.length)];
  return tpl(item.de,item.ar);
}

function lueckeRender(){
  const body=document.getElementById('lueckeBody');
  if(!body)return;
  const allAnswered=lueckeExercise.every(e=>e.answered);
  const correct=lueckeExercise.filter(e=>e.correct).length;

  let html=`<div class="luecke-exercise">`;
  lueckeExercise.forEach((item,idx)=>{
    const parts=item.sentence.split('___');
    const inputClass=item.answered?(item.correct?'correct':'wrong'):'';
    const inputVal=item.answered?item.de:'';
    html+=`<div class="luecke-item" id="luecke-${idx}">
      <div class="luecke-sentence" dir="ltr">
        ${esc(parts[0])}<input class="luecke-input ${inputClass}" id="linput-${idx}" ${item.answered?`value="${esc(item.de)}" readonly`:'placeholder="…"'} dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(parts[1]||'')}
      </div>
      <div class="luecke-hint${item.answered&&!item.correct?' show-ans':''}" id="lhint-${idx}">
        ${item.answered?(!item.correct?`✗ الجواب الصحيح: <strong>${esc(item.de)}</strong>`:`✓ صحيح!`):`💡 المعنى: ${esc(item.ar)}`}
      </div>
    </div>`;
  });
  html+=`</div>`;
  if(!allAnswered){
    html+=`<div class="luecke-check-row">
      <button class="luecke-check" onclick="lueckeCheck()">✓ تصحيح</button>
      <button class="luecke-new" onclick="lueckeGenerate()">🎲 تمرين جديد</button>
    </div>`;
  } else {
    html+=`<div class="luecke-check-row">
      <span class="luecke-score">النتيجة: ${correct}/${lueckeExercise.length} ✓</span>
      <button class="luecke-new" onclick="lueckeGenerate()">🎲 تمرين جديد</button>
    </div>`;
  }
  body.innerHTML=html;

  lueckeExercise.forEach((_,idx)=>{
    const inp=document.getElementById('linput-'+idx);
    if(inp&&!lueckeExercise[idx].answered){
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')lueckeCheck();});
    }
  });
}

function lueckeCheck(){
  lueckeExercise.forEach((item,idx)=>{
    if(item.answered)return;
    const inp=document.getElementById('linput-'+idx);
    if(!inp)return;
    const val=inp.value.trim();
    const correct=norm(val)===norm(item.de);
    item.answered=true;item.correct=correct;
  });
  lueckeRender();
}
